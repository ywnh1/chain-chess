<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>连锁棋</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;
  --surface:rgba(26,26,34,.85);
  --card:rgba(35,35,45,.75);
  --border:rgba(255,255,255,.08);
  --accent:#f0b34b;
  --accent2:#5fc3c3;
  --text:#e8e6e3;
  --dim:#7a7885;
  --radius:12px;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --glow:0 0 40px rgba(240,179,75,.05);
  --glass:rgba(255,255,255,.04);
  --glass-border:rgba(255,255,255,.06);
  --glass-shadow:0 4px 24px rgba(0,0,0,.3);
  --glass-shine:rgba(255,255,255,.03);
  --glass-edge:rgba(255,255,255,.06);
  --font:'Inter','SF Pro','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
html{font-size:clamp(14px,3.5vw,17px)}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px;
  transition:background .6s ease,box-shadow .4s ease;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  line-height:1.5;
}
body::before{content:'';position:fixed;inset:0;background:
    radial-gradient(ellipse 70% 50% at 50% -10%,rgba(240,179,75,.04) 0%,transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 90%,rgba(95,195,195,.03) 0%,transparent 70%),
    radial-gradient(ellipse 50% 30% at 20% 40%,rgba(240,179,75,.015) 0%,transparent 60%),
    radial-gradient(ellipse 40% 25% at 80% 60%,rgba(95,195,195,.015) 0%,transparent 60%);
  background-size:200% 200%,200% 200%,200% 200%,200% 200%;
  animation:liquidDrift 20s ease-in-out infinite;
  pointer-events:none;z-index:0}
@keyframes liquidDrift{
  0%{background-position:50% -10%,100% 90%,20% 40%,80% 60%}
  25%{background-position:55% -8%,95% 88%,25% 38%,75% 65%}
  50%{background-position:45% -12%,105% 92%,15% 42%,85% 55%}
  75%{background-position:52% -9%,98% 85%,22% 36%,78% 62%}
  100%{background-position:50% -10%,100% 90%,20% 40%,80% 60%}
}
.screen.active{position:relative;z-index:1}
.screen{display:none}
.screen.active{display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px}

/* welcome */
#welcome{gap:2rem;text-align:center}
.logo{font-size:3rem;letter-spacing:2px}
.logo span{color:var(--accent)}
.tagline{color:var(--dim);font-size:.9rem;margin-top:-.5rem}
.mode-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.mode-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 16px;cursor:pointer;
  transition:.25s;text-align:left;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.mode-card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mode-card:active{background:rgba(255,255,255,.1);border-color:var(--accent);transform:scale(.98)}
.mode-card .icon{font-size:1.8rem;flex-shrink:0}
.mode-card .body{flex:1}
.mode-card .body h3{font-size:1rem;font-weight:600}
.mode-card .body p{font-size:.8rem;color:var(--dim);margin-top:2px}

/* lobby */
#aiLobby,#localLobby,#eveLobby{max-width:480px;gap:.75rem;width:100%}
#aiLobby .back,#localLobby .back,#history .back,#eveLobby .back{
  align-self:flex-start;
  background:none;border:none;color:var(--dim);
  font-size:.85rem;cursor:pointer;padding:6px 0;
  display:flex;align-items:center;gap:4px;transition:.15s;
}
#aiLobby .back:active,#localLobby .back:active,#history .back:active,#eveLobby .back:active{color:var(--text)}
#aiLobby h2,#localLobby h2,#history h2,#eveLobby h2{font-size:1.2rem;font-weight:600;margin-bottom:4px}
.form-row{margin:8px 0;display:flex;flex-direction:column;gap:4px;width:100%}
.form-row label{font-size:.78rem;color:var(--dim);font-weight:500}
.form-row input,.form-row select{
  width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,.04);color:var(--text);
  font-size:.9rem;outline:none;transition:.15s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.form-row input:focus,.form-row select:focus{
  border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,179,75,.15);
}
.form-row select option{background:var(--surface);color:var(--text)}
.form-eve-config{width:100%;max-height:240px;overflow-y:auto;margin:4px 0;display:flex;flex-direction:column;gap:6px}
.eve-ai-row{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);
  border-radius:8px;padding:6px 10px;margin:4px 0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.eve-ai-row .color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.eve-ai-row .eve-label{font-size:.78rem;font-weight:600;min-width:44px}
.eve-ai-row select{flex:1;padding:5px 6px;border:1px solid var(--border);border-radius:6px;
  background:rgba(255,255,255,.04);color:var(--text);font-size:.75rem;outline:none}
.eve-ai-row select:focus{border-color:var(--accent)}
.eve-ai-row select option{background:var(--surface);color:var(--text)}
.btn-primary{
  width:100%;padding:12px;background:var(--accent);color:#0f0f13;
  border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s;
  box-shadow:0 4px 20px rgba(240,179,75,.25);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.btn-primary:hover{opacity:.92;box-shadow:0 4px 20px rgba(240,179,75,.3);transform:translateY(-1px)}
.btn-primary:active{opacity:.8;transform:scale(.98)}

/* game */
#game{max-width:520px;gap:8px;width:100%}
#game .top{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:6px 0 8px;
}
#game .top-left{display:flex;gap:8px;align-items:center}
#game .top-left button{
  background:rgba(255,255,255,.08);color:var(--dim);
  border:none;padding:7px 12px;border-radius:8px;font-size:.72rem;
  cursor:pointer;transition:.15s;font-weight:500;letter-spacing:.3px;
}
#game .top-left button:active{background:rgba(255,255,255,.15);transform:scale(.96)}
#game .top-right{display:flex;gap:4px;align-items:center}
.turn-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:6px;
  background:rgba(255,255,255,.06);
}
.turn-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.board-wrap{
  position:relative;
  width:min(88vw,440px);
  height:min(88vw,440px);
}
#board{width:100%;height:100%;display:grid;gap:min(1.6vw,8px);touch-action:manipulation}
.cell{
  background:rgba(255,255,255,.05);
  border-radius:min(2.2vw,10px);
  position:relative;cursor:pointer;
  transition:background .12s,transform .08s,box-shadow .12s;
  border:1px solid rgba(255,255,255,.03);
}
.cell.highlight{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.1);transform:scale(1.02)}
.cell:active{transform:scale(.95)}
.cell .bg{
  position:absolute;inset:0;
  border-radius:min(2.2vw,10px);opacity:.15;
  transition:.2s;
}
.cell .piece{
  position:absolute;width:76%;height:76%;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.cell .piece.pop{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(0)}
  70%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
.cell.explode{animation:explode .35s ease}
@keyframes explode{
  0%{background:rgba(255,255,255,.4)}
  50%{background:rgba(255,255,255,.7)}
  100%{background:rgba(255,255,255,.05)}
}
.cell .dot{
  position:absolute;width:20%;height:20%;
  border-radius:50%;background:rgba(255,255,255,.88);
  transform:translate(-50%,-50%);
}

/* === 液态玻璃光泽 === */
.glass-shine,.mode-card,.modal-inner,.settlement .stat-card,.settlement .chart-box,
.history-item,.eve-ai-row,.form-row input,.form-row select,#pauseOverlay .stat-card,
#pauseOverlay .chart-box{position:relative;overflow:hidden}
.glass-shine::after,.mode-card::after,.modal-inner::after,
.settlement .stat-card::after,.settlement .chart-box::after,
.history-item::after,.eve-ai-row::after,
#pauseOverlay .stat-card::after,#pauseOverlay .chart-box::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  border-radius:inherit;
  background:linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,255,255,.04) 35%,
    rgba(255,255,255,.07) 40%,
    rgba(255,255,255,.02) 43%,
    transparent 48%
  );
  background-size:300% 100%;
  animation:glassSweep 6s ease-in-out infinite;
}
.mode-card::after,.modal-inner::after{border-radius:12px}
@keyframes glassSweep{
  0%{background-position:200% 0}
  50%{background-position:-20% 0}
  100%{background-position:-200% 0}
}
/* 边框液态光晕 */
.mode-card,.modal-inner,.settlement .stat-card,.settlement .chart-box,
.history-item,#pauseOverlay .stat-card,#pauseOverlay .chart-box{
  border-color:rgba(255,255,255,.06);
  transition:border-color .4s ease,box-shadow .4s ease;
}
.mode-card:hover,.history-item:hover{
  border-color:rgba(255,255,255,.14);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(240,179,75,.04);
}
/* 按钮玻璃光泽 */
.btn-primary,.settlement .btn-again{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--accent) 0%,#e8a030 50%,var(--accent) 100%);
  background-size:200% 100%;
  animation:btnShimmer 8s ease-in-out infinite;
}
@keyframes btnShimmer{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.btn-primary::after,.settlement .btn-again::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.15) 35%,rgba(255,255,255,.08) 40%,transparent 45%);
  background-size:300% 100%;
  animation:glassSweep 5s ease-in-out infinite;
}
/* 暂停覆盖面保持液态玻璃 */
#pauseOverlay.settlement{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
#pauseOverlay .stat-card,#pauseOverlay .chart-box{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
}
#pauseOverlay #pauseCharts{display:flex;flex-direction:column;gap:12px;width:100%}
#pauseOverlay .stats-grid{gap:8px}
#pauseOverlay .btn-primary{margin-top:4px}

/* player colours */
.p0{background:#e8645a}
.p1{background:#f0c040}
.p2{background:#40b8f0}
.p3{background:#50d060}
.p4{background:#c080f0}
.p5{background:#f070c0}
.p6{background:#50d0b0}
.p7{background:#ff884d}
.p8{background:#e868a0}
.p9{background:#70c0e8}

/* msg */
#msg{
  font-size:.75rem;padding:4px 10px;border-radius:6px;
  transition:.2s;min-height:1.5rem;
}
#msg.error{background:#c0392b;color:#fff}
#msg.success{background:#27ae60;color:#fff}

/* modal */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  justify-content:center;align-items:center;z-index:1000;padding:16px;
}
.modal.show{display:flex}
.modal-inner{
  background:var(--surface);
  padding:24px;border-radius:var(--radius);
  width:100%;max-width:360px;
  animation:modalIn .2s ease;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-inner h3{font-size:1.05rem;font-weight:600;text-align:center;margin-bottom:16px}
.form-row{margin:10px 0;display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:.8rem;color:var(--dim)}
.form-row input,.form-row select{
  width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,.04);color:var(--text);
  font-size:.9rem;outline:none;transition:.15s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.form-row input:focus,.form-row select:focus{
  border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,179,75,.15);
}
.form-row select option{background:var(--surface);color:var(--text)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{
  flex:1;padding:10px;border:none;border-radius:8px;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.12s;
}
.modal-actions button:active{opacity:.75}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--dim)}
.btn-ghost:active{opacity:.75}

/* player bar */
.player-bar{
  display:flex;gap:8px;width:min(88vw,440px);margin:8px 0;
  flex-wrap:wrap;justify-content:center;
}
.player-tag{
  padding:5px 12px;border-radius:8px;
  font-size:.72rem;font-weight:600;
  opacity:.35;transition:.25s;
  border:1px solid transparent;
  white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.player-tag .cnt{
  display:inline-block;min-width:1.2em;
  text-align:center;margin-left:4px;
  font-size:.82rem;font-weight:700;
}
.player-tag.active{opacity:1;border-color:rgba(255,255,255,.15);transform:scale(1.06);box-shadow:0 0 12px rgba(255,255,255,.06)}
.player-tag.elim{opacity:.15;text-decoration:line-through}

/* settlement */
.settlement{
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;overflow-y:auto;
  animation:fadeIn .4s ease;
}
.settlement-inner{
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.settlement h2{font-size:1.5rem;margin:8px 0 4px;text-align:center}
.settlement .winner-color{
  display:inline-block;width:14px;height:14px;
  border-radius:50%;vertical-align:middle;margin-right:6px;
}
.settlement .stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:8px;width:100%;
}
.settlement .stat-card{
  background:rgba(255,255,255,.06);border-radius:10px;
  padding:10px 8px;text-align:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
}
.settlement .stat-card .color-dot{
  display:inline-block;width:10px;height:10px;
  border-radius:50%;margin-right:4px;vertical-align:middle;
}
.settlement .stat-card .name{font-size:.8rem;font-weight:600}
.settlement .stat-card .num{font-size:1.1rem;font-weight:700;margin-top:2px}
.settlement .stat-card .lbl{font-size:.65rem;color:var(--dim)}
.settlement .chart-box{
  width:100%;background:rgba(255,255,255,.04);
  border-radius:10px;padding:10px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);
}
.settlement .chart-box h4{font-size:.8rem;font-weight:500;margin-bottom:6px;text-align:center;color:var(--dim)}
.settlement .chart-box canvas{width:100%;height:150px;display:block}
.settlement .chart-legend{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-top:4px;
}
.settlement .chart-legend span{
  font-size:.65rem;display:inline-flex;align-items:center;gap:3px;
}
.settlement .chart-legend .leg-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.settlement .btn-again{
  padding:12px 32px;background:var(--accent);color:#0f0f13;
  border:none;border-radius:10px;font-size:.95rem;font-weight:600;
  cursor:pointer;margin:8px 0 16px;transition:.2s;
  box-shadow:0 4px 20px rgba(240,179,75,.25);
}
.settlement .btn-again:active{opacity:.8}
/* history */
.history-list{width:100%;overflow-y:auto;max-height:60vh}
.history-item{
  background:rgba(255,255,255,.04);border-radius:10px;padding:12px;margin:8px 0;
  border:1px solid var(--border);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:.15s;
}
.history-item:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.06)}
.history-item .h-time{font-size:.7rem;color:var(--dim)}
.history-item .h-info{font-size:.8rem;margin:4px 0}
.history-item .h-info strong{color:var(--accent2)}
.history-item .h-details{font-size:.7rem;color:var(--dim)}
.history-item .h-winner{display:inline-block;font-size:.75rem;font-weight:600;margin-top:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<!-- Welcome -->
<div id="welcome" class="screen active">
  <div class="logo">♟<span>连锁棋</span></div>
  <div class="tagline">多人联手，一触即发</div>
  <div class="mode-cards">
    <div class="mode-card" onclick="showAILobby()" style="border-color:rgba(240,179,75,.18)">
      <div class="icon">🤖</div>
      <div class="body">
        <h3>AI 对战</h3>
        <p>与电脑 AI 对决，挑战不同难度</p>
      </div>
    </div>
    <div class="mode-card" onclick="showLocalLobby()" style="border-color:rgba(95,195,195,.18)">
      <div class="icon">👥</div>
      <div class="body">
        <h3>本地对战</h3>
        <p>同一设备，轮流落子，朋友面前大战</p>
      </div>
    </div>
    <div class="mode-card" onclick="showEveLobby()" style="border-color:rgba(192,128,240,.25)">
      <div class="icon">⚔️</div>
      <div class="body">
        <h3>AI 斗蛐蛐</h3>
        <p>自定义 AI 阵容，观看 AI 互相博弈</p>
      </div>
    </div>
    <div class="mode-card" onclick="showHistory()" style="border-color:rgba(95,195,195,.2)">
      <div class="icon">📋</div>
      <div class="body">
        <h3>历史记录</h3>
        <p>查看对局记录和统计数据</p>
      </div>
    </div>
  </div>
  <button onclick="exitApp()" style="margin-top:1rem;background:none;border:1px solid rgba(255,255,255,.08);color:var(--dim);padding:8px 20px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:.15s;" onmouseover="this.style.borderColor='rgba(255,255,255,.2)'" onmouseout="this.style.borderColor='rgba(255,255,255,.08)'">✕ 关闭应用</button>
</div>

<!-- History Screen -->
<div id="history" class="screen">
  <button class="back" onclick="goHome()">← 返回</button>
  <div style="display:flex;justify-content:space-between;align-items:center;width:100%">
    <h2 style="margin:0">📋 历史记录</h2>
    <button onclick="clearHistory()" style="background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.2);color:rgba(255,100,100,.9);padding:6px 14px;border-radius:8px;font-size:.75rem;cursor:pointer;transition:.15s;font-weight:500" onmouseover="this.style.background='rgba(255,80,80,.2)'" onmouseout="this.style.background='rgba(255,80,80,.12)'">🗑 清空历史</button>
  </div>
  <p style="font-size:.85rem;color:var(--dim);margin:4px 0 12px">所有对局记录</p>
  <div id="historyList" class="history-list">
    <div class="empty">加载中...</div>
  </div>
</div>

<!-- AI Lobby -->
<div id="aiLobby" class="screen">

<script>

const COLORS=['#e8645a','#f0c040','#40b8f0','#50d060','#c080f0','#f070c0','#50d0b0','#ff884d','#e868a0','#70c0e8'];
const COLORS_LIGHT=['rgba(232,100,90,.08)','rgba(240,192,64,.08)','rgba(64,184,240,.08)','rgba(80,208,96,.08)','rgba(192,128,240,.08)','rgba(240,112,192,.08)','rgba(80,208,176,.08)','rgba(255,136,77,.08)','rgba(232,104,160,.08)','rgba(112,192,232,.08)'];

// ========== 音效 ==========
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
  }
  return audioCtx;
}
function playTone(f,dur,type,vol){
  try{
    let ctx=getAudioCtx();if(!ctx)return;
    let osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(f,ctx.currentTime);
    gain.gain.setValueAtTime(vol||0.15,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playClick(){playTone(800,0.08,'sine',0.12)}
function playExplosion(){playTone(150,0.25,'sawtooth',0.15)}
function playElim(){
  playTone(400,0.15,'square',0.08);
  setTimeout(()=>playTone(300,0.15,'square',0.08),120);
  setTimeout(()=>playTone(200,0.2,'square',0.08),240);
}
function playGameOver(){
  playTone(523,0.15,'sine',0.12);
  setTimeout(()=>playTone(659,0.15,'sine',0.12),150);
  setTimeout(()=>playTone(784,0.3,'sine',0.15),300);
}

/* ==================== STATE ==================== */

// 首子落位（用于限制其他玩家落子）

// Tauri invoke helper
function tauriInvoke(cmd, args){
  return window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke 
    ? window.__TAURI_INTERNALS__.invoke(cmd, args || {})
    : Promise.reject(new Error('Not in Tauri'));
}
function loadHistoryList(){
  let el=document.getElementById('historyList');
  el.innerHTML='<div class="empty">加载中...</div>';
  tauriInvoke('load_game_history').then(list=>{
    if(!list||list.length===0){
      el.innerHTML='<div class="empty">暂无历史记录</div>';
      return;
    }
    el.innerHTML='';
    // 倒序显示（最新的在前）
    for(let i=list.length-1;i>=0;i--){
      let r=list[i];

      let winnerColor=r.winner!==null&&r.winner!==undefined?COLORS[r.winner]||'#888':'#888';
      div.style.cursor='pointer';
      div.onclick=function(){showHistoryDetail(r)};
      div.innerHTML=`
        <div class="h-time">🕐 ${r.time}</div>
        <div class="h-info">${modeLabel} · ${r.boardSize}×${r.boardSize} · ${r.playerCount}人${r.aiCount>0?(' · AI×'+r.aiCount):''}</div>
        <div class="h-winner" style="color:${winnerColor}">🏆 ${winnerName}</div>
        <div class="h-details">${r.aiAlgorithm?('算法: '+r.aiAlgorithm):''}${r.aiDepth>0?(' · 深度: '+r.aiDepth):''}</div>
      `;
      el.appendChild(div);
    }
  }).catch(()=>{
    el.innerHTML='<div class="empty">暂无可用的历史记录</div>';
  });
}
function clearHistory(){
  if(!confirm('确定要清空所有历史记录吗？此操作不可恢复。'))return;
  tauriInvoke('clear_game_history').then(()=>{
    document.getElementById('historyList').innerHTML='<div class="empty">历史记录已清空</div>';
  }).catch(e=>{
    console.warn('Clear history failed:', e);
    alert('清空历史失败');
  });
}
// 格式化时间为 YYYY/MM/DD HH:mm:ss
function formatTime(d){
  let y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  let h=d.getHours(),mi=d.getMinutes(),s=d.getSeconds();
  return y+'/'+(m<10?'0'+m:m)+'/'+(dd<10?'0'+dd:dd)+' '+(h<10?'0'+h:h)+':'+(mi<10?'0'+mi:mi)+':'+(s<10?'0'+s:s);
}
// Save game history for Tauri
function saveGameHistory(winner, mode, aiAlg, aiDp){
  tauriInvoke('save_game_history', {
    record: {
      id: Date.now(),
      time: formatTime(new Date()),

      aiDepth: aiDp || aiDepth || 0,
      gameCount: gameCount,
      playerCount: maxPlayers,
      aiCount: aiPlayers.size,
      boardSize: size,

/* ==================== GAME LOGIC ==================== */
function cap(i,j,s){return 4}
function nbrs(i,j,s){
  let r=[];
  if(i>0)r.push([i-1,j]);if(i<s-1)r.push([i+1,j]);
  if(j>0)r.push([i,j-1]);if(j<s-1)r.push([i,j+1]);
  return r;
}
function nbrs8(i,j,s){
  let r=[];
  for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
    if(di===0&&dj===0)continue;
    let ni=i+di,nj=j+dj;
    if(ni>=0&&ni<s&&nj>=0&&nj<s)r.push([ni,nj]);
  }
  return r;
}
function mkBoard(s){
  return Array.from({length:s},()=>Array.from({length:s},()=>({owner:null,count:0})));
}
function hasPieces(p,b){
  for(let r of b)for(let c of r)if(c.owner===p)return true;
  return false;
}
function nearAny(i,j,s,b){
  for(let[ni,nj]of nbrs8(i,j,s)){if(b[ni][nj].owner!==null)return true}
  return false;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// 判断是否在首子限制区域内（上下各2格、左右各2格、斜角各1格，共12格）
function isInFirstMoveRestricted(x,y,fx,fy){
  let dx=x-fx, dy=y-fy;
  if(dx===2&&dy===0)return true;
  if(dx===-2&&dy===0)return true;
  if(dx===1&&dy>=-1&&dy<=1)return true;
  if(dx===-1&&dy>=-1&&dy<=1)return true;
  if(dx===0&&dy>=-2&&dy<=2&&!(dx===0&&dy===0))return true;
  return false;
}

function recordHistory(){
  let sn={};
  for(let p=0;p<maxPlayers;p++){
    let pieces=0,points=0;
    for(let r of board)for(let c of r)if(c.owner===p){pieces++;points+=c.count}
    sn[p]={pieces,points};
  }
  gameHistory.push({turn:gameHistory.length,snapshot:sn});
}

async function processClick(b,s,x,y,pl,anim){
  let c=b[x][y];
  if(c.owner===null){
    // 记录全局首次落子位置
    let anyPieces=false;
    for(let r of b)for(let cl of r)if(cl.owner!==null)anyPieces=true;
    if(!anyPieces) firstMovePos=[x,y];
    let first = !hasPieces(pl,b);
    c.owner=pl;
    c.count=first?3:1;
  }
  else if(c.owner===pl)c.count++
  else return[];
  let had=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)had.add(cl.owner);
  let chain=[[x,y]];
  let chainCount=0;
  while(chain.length){
    let[cx,cy]=chain.shift(),cell=b[cx][cy],capv=cap(cx,cy,s);
    if(cell.count>=capv){
      cell.count=0;cell.owner=null;
      chainCount++;
      playExplosion();
      for(let[nx,ny]of nbrs(cx,cy,s)){
        let nc=b[nx][ny];nc.owner=pl;nc.count++;chain.push([nx,ny]);
      }
      if(anim){
        let el=cells?.[cx]?.[cy];if(el)el.classList.add('explode');
        renderBoard(false,anim==='pop'?cx:undefined);
        await sleep(180);
        if(el)el.classList.remove('explode');
      }
    }
  }
  // 记录连爆统计
  if(chainCount > 0){
    if(!chainStats[pl]) chainStats[pl] = {triggered: 0, maxChain: 0};
    chainStats[pl].triggered++;
    if(chainCount > chainStats[pl].maxChain) chainStats[pl].maxChain = chainCount;
    if(chainCount > maxChainOverall.length){
      maxChainOverall = {player: pl, length: chainCount};
    }
  }
  let now=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)now.add(cl.owner);
  return[...had].filter(p=>!now.has(p));
}

/* 同步版落子（不含动画/音效，专供搜索使用） */
function processClickSync(b,s,x,y,pl){
  let c=b[x][y];
  if(c.owner===null){
    let first=!hasPieces(pl,b);
    c.owner=pl;
    c.count=first?3:1;
  }else if(c.owner===pl)c.count++;
  else return[];
  let had=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)had.add(cl.owner);
  let chain=[[x,y]];
  while(chain.length){
    let[cx,cy]=chain.shift(),cell=b[cx][cy],capv=cap(cx,cy,s);
    if(cell.count>=capv){
      cell.count=0;cell.owner=null;
      for(let[nx,ny]of nbrs(cx,cy,s)){
        let nc=b[nx][ny];nc.owner=pl;nc.count++;chain.push([nx,ny]);
      }
    }
  }
  let now=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)now.add(cl.owner);
  return[...had].filter(p=>!now.has(p));
}

/* ==================== AI ENGINE ==================== */
function countOpponentLevelAround(b,sz,i,j,player,level){
  let cnt=0;
  for(let[ni,nj]of nbrs(i,j,sz)){
    let nc=b[ni][nj];
    if(nc.owner!==null&&nc.owner!==player&&nc.count===level)cnt++;
  }
  return cnt;
}
function hasOpponentLevelNear(b,sz,i,j,player,level){
  for(let[ni,nj]of nbrs(i,j,sz)){
    let nc=b[ni][nj];
    if(nc.owner!==null&&nc.owner!==player&&nc.count===level)return true;
  }
  return false;
}
function aiFindMove(player,sz,b){
  let mine=[];
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
    if(b[i][j].owner===player)mine.push([i,j]);
  if(mine.length===0){
    let candidates=[];
    // 首子限制：非首位玩家首次落子需避开首子限制区域
    let skipRestricted=firstMovePos&&player!==0;
    // 先只考虑非边角的格子
    for(let i=1;i<sz-1;i++)for(let j=1;j<sz-1;j++)
      if(b[i][j].owner===null&&!nearAny(i,j,sz,b)){
        if(skipRestricted&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
        candidates.push([i,j]);
      }
    // 如果中间没有合法位置，才回退到边角
    if(candidates.length===0){
      for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
        if(b[i][j].owner===null&&!nearAny(i,j,sz,b)){
          if(skipRestricted&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
          candidates.push([i,j]);
        }
    }
    if(candidates.length===0){
      for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
        if(b[i][j].owner===null){
          if(skipRestricted&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
          candidates.push([i,j]);
        }
    }
    if(candidates.length===0)return null;
    // 选最靠近中心的
    let cx=sz/2-0.5,cy=sz/2-0.5;
    return candidates.reduce((a,b2)=>{
      let da=Math.abs(a[0]-cx)+Math.abs(a[1]-cx);
      let db=Math.abs(b2[0]-cx)+Math.abs(b2[1]-cx);
      return da<=db?a:b2;
    });
  }
  // 1. 三级棋子（同等条件随机选择）
  let lv3=mine.filter(([i,j])=>b[i][j].count===3);
  if(lv3.length>0){
    let best=[],bestCnt=-1;
    for(let[i,j]of lv3){
      let cnt=countOpponentLevelAround(b,sz,i,j,player,3);
      if(cnt>bestCnt){bestCnt=cnt;best=[[i,j]]}
      else if(cnt===bestCnt)best.push([i,j]);
    }
    if(bestCnt>=1)return best[Math.floor(Math.random()*best.length)];
  }
  // 2. 安全二级（同等条件随机选择）
  let lv2=mine.filter(([i,j])=>b[i][j].count===2);
  let safeLv2=lv2.filter(([i,j])=>!hasOpponentLevelNear(b,sz,i,j,player,3));
  if(safeLv2.length>0){
    let best=[],bestScore=-Infinity;
    for(let[i,j]of safeLv2){
      let edge=((i===0||i===sz-1)||(j===0||j===sz-1))?3:0;
      let corner=((i===0||i===sz-1)&&(j===0||j===sz-1))?5:0;
      let nearAnyOpp=0;
      for(let[ni,nj]of nbrs(i,j,sz)){
        let nc=b[ni][nj];
        if(nc.owner!==null&&nc.owner!==player)nearAnyOpp++;
      }
      let score=edge+corner-nearAnyOpp*5+Math.random()*1;
      if(score>bestScore){bestScore=score;best=[[i,j]]}
      else if(Math.abs(score-bestScore)<0.01)best.push([i,j]);
    }
    return best[Math.floor(Math.random()*best.length)];
  }
  // 3. 一进二（同等条件随机选择）
  let lv1=mine.filter(([i,j])=>b[i][j].count===1);
  if(lv1.length>0){
    let best=[],bestScore=-Infinity;
    for(let[i,j]of lv1){
      let nearOpp=0;
      for(let[ni,nj]of nbrs(i,j,sz)){
        let nc=b[ni][nj];
        if(nc.owner!==null&&nc.owner!==player)nearOpp++;
      }
      let score=-nearOpp*3+Math.random()*2;
      if(score>bestScore){bestScore=score;best=[[i,j]]}
      else if(Math.abs(score-bestScore)<0.01)best.push([i,j]);
    }
    return best[Math.floor(Math.random()*best.length)];
  }
  // 4. 下三级
  if(lv2.length>0){
    let best=null,bestScore=-Infinity;
    for(let[i,j]of lv2){
      let nearOpp=0;
      for(let[ni,nj]of nbrs(i,j,sz)){
        let nc=b[ni][nj];
        if(nc.owner!==null&&nc.owner!==player)nearOpp+=5;
      }
      let edge=((i===0||i===sz-1)||(j===0||j===sz-1))?2:0;
      let score=nearOpp+edge+Math.random()*1;
      if(score>bestScore){bestScore=score;best=[i,j]}
    }
    return best;
  }
  // 5. 随机
  let available=mine.filter(([i,j])=>b[i][j].count<cap(i,j,sz));
  if(available.length>0)return available[Math.floor(Math.random()*available.length)];
  return mine[0];
}

/* ==================== ALPHA-BETA 剪枝 ==================== */
function cloneBoard(b){
  return b.map(row=>row.map(c=>({owner:c.owner,count:c.count})));
}
function evaluateBoard(b,sz,player){
  let myScore=0,oppScore=0;
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(c.owner===player)myScore+=c.count;
    else if(c.owner!==null)oppScore+=c.count;
  }
  let territory=0;
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(c.owner===player)territory++;
    else if(c.owner!==null)territory--;
  }
  return (myScore-oppScore)*2+territory;
}
function getPlayerMoves(b,sz,player){
  let hasP=hasPieces(player,b);
  let moves=[];
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(hasP){
      if(c.owner===player&&c.count<cap(i,j,sz))moves.push([i,j]);
    }else{
      if(c.owner===null&&!nearAny(i,j,sz,b)){
        // 非首位玩家首次落子需避开首子限制区域
        if(firstMovePos&&player!==0&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
        moves.push([i,j]);
      }
    }
  }
  return moves;
}
function orderMoves(moves,b,sz,player,isMax){
  return moves.sort((a,b2)=>{
    let ca1=b[a[0]][a[1]].count,cb1=b[b2[0]][b2[1]].count;
    let pa=ca1*10,pb=cb1*10;
    if(ca1>=3)pa+=100;if(cb1>=3)pb+=100;
    let na=0,nb=0;
    for(let[ni,nj]of nbrs(a[0],a[1],sz)){let nc=b[ni][nj];if(nc.owner!==null&&nc.owner!==player)na+=nc.count;}
    for(let[ni,nj]of nbrs(b2[0],b2[1],sz)){let nc=b[ni][nj];if(nc.owner!==null&&nc.owner!==player)nb+=nc.count;}
    pa+=na*5;pb+=nb*5;
    return pb-pa;
  });
}
function alphaBeta(b,sz,player,depth,maxDepth,alpha,beta,aiPlayer,startTime,timeLimit,alivePlayers,elimSet){
  if(depth>=maxDepth||Date.now()-startTime>timeLimit)return{score:evaluateBoard(b,sz,aiPlayer)};
  let moves=getPlayerMoves(b,sz,player);
  if(moves.length===0)return{score:evaluateBoard(b,sz,aiPlayer)};
  if(moves.length===1)return{score:evaluateBoard(b,sz,aiPlayer),move:moves[0]};
  let ordered=orderMoves(moves,b,sz,player,player===aiPlayer);
  if(ordered.length>10)ordered=ordered.slice(0,10);
  let isMax=player===aiPlayer;
  let best=isMax?{score:-Infinity}:{score:Infinity};
  for(let[i,j]of ordered){
    let nb=cloneBoard(b);
    let elim=processClickSync(nb,sz,i,j,player);
    let newElim=new Set(elimSet);
    for(let e of elim)newElim.add(e);
    let alive=alivePlayers.filter(p=>!newElim.has(p));
    if(alive.length<=1){
      let sc=isMax?Infinity:-Infinity;
      if(isMax&&sc>best.score){best={score:sc,move:[i,j]}}
      else if(!isMax&&sc<best.score){best={score:sc,move:[i,j]}}
      continue;
    }
    let nextIdx=alive.indexOf(player);
    let nextPlayer=alive[(nextIdx+1)%alive.length];
    let result=alphaBeta(nb,sz,nextPlayer,depth+1,maxDepth,alpha,beta,aiPlayer,startTime,timeLimit,alive,newElim);
    if(isMax){
      if(result.score>best.score){best={score:result.score,move:[i,j]}}
      alpha=Math.max(alpha,result.score);
    }else{
      if(result.score<best.score){best={score:result.score,move:[i,j]}}
      beta=Math.min(beta,result.score);
    }
    if(beta<=alpha)break;
  }
  return best;
}
function aiFindMoveAlphaBeta(player,sz,b,depth){
  let startTime=Date.now(),timeLimit=3000+depth*500;
  let allMoves=getPlayerMoves(b,sz,player);
  if(allMoves.length===1)return allMoves[0];
  if(!hasPieces(player,b)){
    let candidates=[];
    let skipRestricted=firstMovePos&&player!==0;
    for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
      if(b[i][j].owner===null&&!nearAny(i,j,sz,b)){
        if(skipRestricted&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
        candidates.push([i,j]);
      }
    if(candidates.length===0){
      for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
        if(b[i][j].owner===null){
          if(skipRestricted&&isInFirstMoveRestricted(i,j,firstMovePos[0],firstMovePos[1]))continue;
          candidates.push([i,j]);
        }
    }
    if(candidates.length===0)return null;
    let cx=sz/2-0.5;
    return candidates.reduce((a,b2)=>{let da=Math.abs(a[0]-cx)+Math.abs(a[1]-cx),db=Math.abs(b2[0]-cx)+Math.abs(b2[1]-cx);return da<=db?a:b2;});
  }
  let alivePlayers=[];
  for(let p=0;p<maxPlayers;p++){
    if(!eliminatedPlayers.has(p)&&(p===player||hasPieces(b,p)))alivePlayers.push(p);
  }
  if(alivePlayers.length<=1)return null;
  let result=alphaBeta(b,sz,player,0,depth,-Infinity,Infinity,player,startTime,timeLimit,alivePlayers,eliminatedPlayers);
  return result.move||null;
}

async function triggerAI(){
  if(gameOver||aiThinking||isPaused)return;
  if(!aiPlayers.has(curPlayer))return;
  aiThinking=true;
  showMsg(`🤔 AI ${curPlayer+1} 思考中...`,'');
  await sleep(50);
  let move;
  // 获取当前 AI 的配置（eve 模式用 per-AI config，其他模式用全局配置）
  let alg = aiConfigs[curPlayer] ? aiConfigs[curPlayer].algorithm : aiAlgorithm;
  let dep = aiConfigs[curPlayer] ? aiConfigs[curPlayer].depth : aiDepth;
  if(alg==='alphabeta'){
    // 调用 Rust 引擎（Rayon 多线程优化）
    try {
      const result = await window.__TAURI_INTERNALS__.invoke('ai_move', {
        board: board,
        size: size,
        player: curPlayer,
        depth: dep,
        eliminated: [...eliminatedPlayers],
        maxPlayers: maxPlayers,
        gameCount: gameCount,
        firstMovePos: firstMovePos,
      });
      if (result && result.length === 2) {
        move = [result[0], result[1]];
      }
    } catch(e) {
      console.warn('Rust AI failed, falling back to JS:', e);
      move = aiFindMoveAlphaBeta(curPlayer, size, board, dep);
    }
  }else{
    move=aiFindMove(curPlayer,size,board);
  }
  if(!move){
    showMsg(`AI ${curPlayer+1} 无合法落子，跳过`,'error');
    aiThinking=false;
    let alive=[];
    for(let p=0;p<maxPlayers;p++){if(!eliminatedPlayers.has(p))alive.push(p);}
    if(alive.length<=1){
      if(alive.length===1){gameOver=true;playGameOver();showSettlement(alive[0],COLOR_NAMES,gameHistory);}
      return;
    }
    let idx=alive.indexOf(curPlayer);
    if(idx<0)idx=0;
    curPlayer=alive[(idx+1)%alive.length];
    renderPlayerBar();setBg(curPlayer);
    if(aiPlayers.has(curPlayer)&&!gameOver)setTimeout(()=>triggerAI(),400);
    return;
  }
  let[x,y]=move;
  let el=cells[x][y];
  if(el)el.style.background='rgba(255,255,255,.15)';
  await new Promise(r=>setTimeout(r,350));
  if(el)el.style.background='';
  aiThinking=false;
  let c=board[x][y];
  if(c.owner!==null&&c.owner!==curPlayer){aiThinking=false;return}
  playClick();
  let elim=await processClick(board,size,x,y,curPlayer,'pop');
  for(let e of elim){eliminatedPlayers.add(e);playElim()}
  recordHistory();
  renderBoard(false,x,y);
  let alive=[];
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    alive.push(p);
  }
  if(alive.length<=1){
    gameOver=true;
    playGameOver();
    showSettlement(alive[0],COLOR_NAMES,gameHistory);
    return;
  }
  let idx=alive.indexOf(curPlayer);
  if(idx<0)idx=0;
  curPlayer=alive[(idx+1)%alive.length];
  renderPlayerBar();
  setBg(curPlayer);
  if(aiPlayers.has(curPlayer)&&!gameOver)setTimeout(()=>triggerAI(),400);
}

  // ★ eve 模式：重建 aiConfigs（用全局默认值补全）
  if(gameMode==='eve'){
    aiConfigs={};
    for(let p=0;p<maxPlayers;p++){
      aiConfigs[p]={algorithm:aiAlgorithm||'strategy',depth:aiDepth||2};
    }
  }
  if(aiPlayers.has(0))setTimeout(()=>triggerAI(),400);
}

function togglePause(){
  if(gameOver)return;
  isPaused=!isPaused;
  let btn=document.getElementById('pauseBtn');
  if(isPaused){
    btn.textContent='▶ 继续';
    showPauseOverlay();
  } else {
    btn.textContent='⏸ 暂停';
    hidePauseOverlay();
  }
}
function showPauseOverlay(){
  let overlay=document.getElementById('pauseOverlay');
  overlay.style.display='flex';

  // ★ 在展示暂停前，立即从 board 实时计算当前状态，追加到历史
  let liveSnap={};
  for(let p=0;p<maxPlayers;p++){
    let pieces=0,points=0;
    for(let r of board)for(let c of r)if(c.owner===p){pieces++;points+=c.count}
    liveSnap[p]={pieces,points};
  }
  // 如果最新一条历史与当前状态不一致，立即追加快照
  let lastSnap=gameHistory.length>0?gameHistory[gameHistory.length-1].snapshot:{};
  let stale=false;
  for(let p=0;p<maxPlayers;p++){
    let old=lastSnap[String(p)];
    let cur=liveSnap[String(p)];
    if(!old||old.pieces!==cur.pieces||old.points!==cur.points){stale=true;break}
  }
  if(stale||gameHistory.length===0){
    gameHistory.push({turn:gameHistory.length,snapshot:liveSnap});
  }

  // 构建暂停统计（使用确保最新的快照）
  let statsGrid=document.getElementById('pauseStats');
  statsGrid.innerHTML='';
  let lastSnap2=gameHistory[gameHistory.length-1].snapshot;
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    let snap=lastSnap2[String(p)];
    let pieces=snap?snap.pieces:0;
    let points=snap?snap.points:0;
    let card=document.createElement('div');card.className='stat-card';
    card.innerHTML=`
      <div class="name">
        <span class="color-dot" style="background:${COLORS[p]||'#888'}"></span>
        ${(COLOR_NAMES&&COLOR_NAMES[p])||getPlayerLabel(p)}
      </div>
      <div class="num" style="color:${COLORS[p]||'#888'}">${pieces}</div>
      <div class="lbl">棋子</div>
      <div class="num" style="color:${COLORS[p]||'#888'}">${points}</div>
      <div class="lbl">点数</div>`;
    statsGrid.appendChild(card);
  }
  // 图表（阈值调为 >=1，任何时候暂停都有数据可看）
  let chartArea=document.getElementById('pauseCharts');
  chartArea.innerHTML='';
  if(gameHistory&&gameHistory.length>=1){
    let box1=document.createElement('div');box1.className='chart-box';
    box1.innerHTML='<h4 style="cursor:pointer" onclick="showFullscreenChart(\'pauseChartPieces\')">📊 棋子数变化 🔍</h4><canvas id="pauseChartPieces" onclick="showFullscreenChart(\'pauseChartPieces\')" style="width:100%;height:150px;display:block;cursor:pointer"></canvas>';
    chartArea.appendChild(box1);
    let box2=document.createElement('div');box2.className='chart-box';
    box2.innerHTML='<h4 style="cursor:pointer" onclick="showFullscreenChart(\'pauseChartPoints\')">📊 点数变化 🔍</h4><canvas id="pauseChartPoints" onclick="showFullscreenChart(\'pauseChartPoints\')" style="width:100%;height:150px;display:block;cursor:pointer"></canvas>';
    chartArea.appendChild(box2);
    setTimeout(()=>{
      drawLineChart(document.getElementById('pauseChartPieces'),gameHistory,COLOR_NAMES,COLORS,'pieces');
      drawLineChart(document.getElementById('pauseChartPoints'),gameHistory,COLOR_NAMES,COLORS,'points');
    },50);
  }
}
function hidePauseOverlay(){
  document.getElementById('pauseOverlay').style.display='none';
}
function resumeGame(){
  isPaused=false;
  document.getElementById('pauseBtn').textContent='⏸ 暂停';
  hidePauseOverlay();
  // 如果是 AI 回合，继续触发 AI
  if(aiPlayers.has(curPlayer)&&!gameOver)setTimeout(()=>triggerAI(),300);
}
function endGameNow(){
  if(gameOver)return;
  gameOver=true;
  let bestP = 0, bestCnt = -1;
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    let cnt=0;
    for(let r of board)for(let c of r)if(c.owner===p)cnt++;
    if(cnt>bestCnt){bestCnt=cnt;bestP=p}
  }
  recordHistory();
  playGameOver();
  showSettlement(bestCnt>0?bestP:null, COLOR_NAMES, gameHistory);
}

async function localClick(x,y){
  if(gameOver||aiThinking||isPaused)return;
  if(aiPlayers.has(curPlayer))return;
  let c=board[x][y];
  let mine=hasPieces(curPlayer,board);
  if(mine){
    if(c.owner!==curPlayer){showMsg('只能点击自己的棋子','');return}
  }else{
    if(c.owner!==null){showMsg('不能抢占别人的格子','');return}
    // 首位玩家可以任意落子，其他玩家不能落在首子限制区域（12格）
    if(firstMovePos&&curPlayer!==0){
      if(isInFirstMoveRestricted(x,y,firstMovePos[0],firstMovePos[1])){
        showMsg('该位置在首子限制区域内','');return
      }
    }
    if(nearAny(x,y,size,board)){showMsg('不能在已有棋子旁边落子','');return}
  }
  playClick();
  let elim=await processClick(board,size,x,y,curPlayer,'pop');
  for(let e of elim){eliminatedPlayers.add(e);playElim()}
  recordHistory();
  renderBoard(false,x,y);
  let alive=[];
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    alive.push(p);
  }
  if(alive.length<=1){
    gameOver=true;
    playGameOver();
    showSettlement(alive[0],COLOR_NAMES,gameHistory);
    return;
  }
  let idx=alive.indexOf(curPlayer);
  if(idx<0)idx=0;
  curPlayer=alive[(idx+1)%alive.length];
  renderPlayerBar();
  setBg(curPlayer);
  if(aiPlayers.has(curPlayer)&&!gameOver)setTimeout(()=>triggerAI(),400);
}

function handleClick(x,y){
  if(!aiThinking&&!isPaused)localClick(x,y);
}

function getPlayerLabel(p){
  if(p===undefined||p===null)return '未知';
  return aiPlayers.has(p)?`AI ${p+1}`:`玩家 ${p+1}`;
}

function drawLineChart(canvas,history,colorNames,colors,valueKey){
  if(!canvas||history.length<1)return;
  let dpr=window.devicePixelRatio||1;
  let rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  let ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  let w=rect.width,h=rect.height;
  let pad={top:18,right:8,bottom:22,left:32};
  let cw=w-pad.left-pad.right,ch=h-pad.top-pad.bottom;
  let players=new Set();
  let maxVal=0;
  for(let turn of history){
    for(let pidStr in turn.snapshot){
      let pid=parseInt(pidStr);
      players.add(pid);
      let v=turn.snapshot[pidStr][valueKey];
      if(v>maxVal)maxVal=v;
    }
  }
  // 总数计算
  let totalByTurn=[];
  for(let turn of history){
    let total=0;
    for(let pidStr in turn.snapshot)total+=turn.snapshot[pidStr][valueKey];
    totalByTurn.push(total);
    if(total>maxVal)maxVal=total;
  }
  if(maxVal===0)maxVal=1;
  let sortedPlayers=[...players].sort((a,b)=>a-b);
  ctx.strokeStyle='rgba(255,255,255,.06)';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    let y=pad.top+(ch*i)/4;
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.font='9px sans-serif';
  ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    let y=pad.top+(ch*i)/4;
    let val=Math.round(maxVal*(1-i/4));
    ctx.fillText(val,pad.left-4,y+3);
  }
  ctx.textAlign='center';
  let turnCount=history.length;
  for(let i=0;i<turnCount;i++){
    if(turnCount>15&&i%Math.ceil(turnCount/10)!==0)continue;
    let x=pad.left+(cw*i)/(turnCount-1||1);
    ctx.fillText(i,x,h-4);
  }
  // 总数白线
  ctx.strokeStyle='rgba(255,255,255,.5)';
  ctx.lineWidth=2;ctx.setLineDash([4,3]);
  ctx.beginPath();
  let startedLine=false;
  for(let i=0;i<history.length;i++){
    let total=totalByTurn[i];
    let x=pad.left+(cw*i)/(history.length-1||1);
    let y=pad.top+ch*(1-total/maxVal);
    if(!startedLine){ctx.moveTo(x,y);startedLine=true;}
    else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.setLineDash([]);
  for(let pid of sortedPlayers){
    let color=colors[pid]||'#888';
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.beginPath();
    let started=false;
    for(let i=0;i<history.length;i++){
      let v=history[i].snapshot[String(pid)]?.[valueKey]||0;
      let x=pad.left+(cw*i)/(history.length-1||1);
      let y=pad.top+ch*(1-v/maxVal);
      if(!started){ctx.moveTo(x,y);started=true;}
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

function showFullscreenChart(canvasId){
  let srcCanvas=document.getElementById(canvasId);
  if(!srcCanvas)return;
  // 创建全屏浮层
  let overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.93);display:flex;justify-content:center;align-items:center;padding:20px;animation:fadeIn .2s ease;';
  // 点击浮层背景关闭
  overlay.onclick=(e)=>{if(e.target===overlay||e.target===closeBtn)overlay.remove()};
  // 关闭按钮
  let closeBtn=document.createElement('button');
  closeBtn.textContent='✕';
  closeBtn.style.cssText='position:fixed;top:16px;right:16px;z-index:2001;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;';
  closeBtn.onmouseover=()=>{closeBtn.style.background='rgba(255,255,255,.15)'};
  closeBtn.onmouseout=()=>{closeBtn.style.background='rgba(0,0,0,.5)'};
  // 大画布
  let bigCanvas=document.createElement('canvas');
  bigCanvas.style.cssText='max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);';
  bigCanvas.onclick=(e)=>e.stopPropagation();
  overlay.appendChild(bigCanvas);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);
  // 以 2.5x 源尺寸重绘，保证清晰
  setTimeout(()=>{
    let rect=bigCanvas.getBoundingClientRect();
    let dpr=window.devicePixelRatio||1;
    let scale=Math.min(2.5,rect.width/srcCanvas.width,rect.height/srcCanvas.height);
    let w=Math.round(srcCanvas.width*scale);
    let h=Math.round(srcCanvas.height*scale);
    bigCanvas.width=w*dpr;
    bigCanvas.height=h*dpr;
    bigCanvas.style.width=w+'px';
    bigCanvas.style.height=h+'px';
    let dstCtx=bigCanvas.getContext('2d');
    dstCtx.scale(dpr,dpr);
    dstCtx.imageSmoothingEnabled=true;
    dstCtx.imageSmoothingQuality='high';
    dstCtx.drawImage(srcCanvas,0,0,w,h);
  },80);
}

  try{document.getElementById('board').innerHTML='';}catch(e){}
  document.body.style.background='';
  // ★ 只移除动态 settlement，保留静态 #pauseOverlay，关闭模态
  document.querySelectorAll('.settlement').forEach(e=>{if(e.id!=='pauseOverlay')e.remove()});
  try{document.getElementById('pauseOverlay').style.display='none';}catch(e){}
  document.querySelectorAll('.modal').forEach(e=>e.classList.remove('show'));
  // ★ 重新显示 game screen 中的暂停按钮和消息，确保 DOM 干净
  try{document.getElementById('pauseBtn').textContent='⏸ 暂停';}catch(e){}
  showMsg('','');
  show('welcome');
  if(location.hash)history.replaceState(null,'',window.location.pathname);
}

function confirmReset(){
  if(gameMode==='local'||gameMode==='ai'||gameMode==='eve'){startLocalReset();return}
  closeModal('resetModal');
}

/* ==================== UTILS ==================== */
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function showMsg(t,c){
  let el=document.getElementById('msg');el.textContent=t;el.className=c||'';
  if(t)setTimeout(()=>{el.textContent='';el.className=''},3000);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')['resetModal'].forEach(id=>closeModal(id));
});
window.addEventListener('popstate',()=>{
  // 游戏中按返回键 → 退出游戏（先重置状态再导航）
  if(gameMode&&gameMode!=='welcome'){exitGame();return}
  // 非游戏中：根据 hash 导航到对应界面
  const h=location.hash.slice(1);
  if(h&&document.getElementById(h))show(h);else show('welcome');
});
</script>
</body>
</html>

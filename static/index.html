<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>连锁棋</title>
<style>
/* ========== reset & vars ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;
  --surface:#1a1a22;
  --card:#23232d;
  --border:rgba(255,255,255,.06);
  --accent:#f0b34b;
  --accent2:#5fc3c3;
  --text:#e8e6e3;
  --dim:#7a7885;
  --radius:12px;
  --shadow:0 2px 20px rgba(0,0,0,.5);
  --font:'Inter','SF Pro','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
html{font-size:clamp(14px,4vw,17px)}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px;
  transition:background .6s ease;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  line-height:1.5;
}

/* ========== screen toggle ========== */
.screen{display:none}
.screen.active{display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px}

/* ========== welcome ========== */
#welcome{
  gap:2rem;
  text-align:center;
}
.logo{
  font-size:3rem;
  letter-spacing:2px;
}
.logo span{color:var(--accent)}
.tagline{
  color:var(--dim);
  font-size:.9rem;
  margin-top:-.5rem;
}
.mode-cards{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
  max-width:320px;
}
.mode-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  cursor:pointer;
  transition:.2s;
  text-align:left;
  display:flex;
  align-items:center;
  gap:14px;
}
.mode-card:active{background:var(--card);border-color:var(--accent)}
.mode-card .icon{font-size:1.8rem;flex-shrink:0}
.mode-card .body{flex:1}
.mode-card .body h3{font-size:1rem;font-weight:600}
.mode-card .body p{font-size:.8rem;color:var(--dim);margin-top:2px}

/* ========== lobby ========== */
#lobby{max-width:480px;gap:1rem}
#lobby .back{
  align-self:flex-start;
  background:none;border:none;color:var(--dim);
  font-size:.85rem;cursor:pointer;padding:6px 0;
  display:flex;align-items:center;gap:4px;
  transition:.15s;
}
#lobby .back:active{color:var(--text)}
#lobby h2{font-size:1.2rem;font-weight:600;margin-bottom:4px}
.section-header{
  display:flex;justify-content:space-between;align-items:center;
  margin:12px 0 6px;font-size:.8rem;color:var(--dim);
}
.section-header strong{font-size:.85rem;color:var(--text)}
.btn-sm{
  background:var(--card);color:var(--accent2);
  border:none;padding:4px 12px;border-radius:6px;
  font-size:.7rem;cursor:pointer;transition:.15s;
}
.btn-sm:active{opacity:.65}
.list-box{
  margin:4px 0 8px;max-height:220px;overflow-y:auto;
  border:1px solid var(--border);border-radius:10px;padding:6px;
  scrollbar-width:thin;scrollbar-color:var(--card) transparent;
}
.empty{color:var(--dim);text-align:center;padding:24px 12px;font-size:.85rem}
.list-item{
  padding:12px;margin:6px 0;border-radius:10px;
  background:rgba(255,255,255,.03);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  transition:.12s;
}
.list-item:active{background:rgba(255,255,255,.08)}
.item-info{flex:1;min-width:0}
.item-info .title{color:#fff;font-size:.9rem;font-weight:500}
.item-info .title .lock{color:var(--accent);margin-left:3px}
.item-info .sub{font-size:.7rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.btn-join,.btn-restore{
  padding:6px 14px;background:var(--accent2);color:#0f0f13;
  border:none;border-radius:6px;font-size:.75rem;font-weight:600;
  cursor:pointer;flex-shrink:0;transition:.12s;
}
.btn-join:active,.btn-restore:active{opacity:.8}
.btn-del{
  padding:6px 14px;background:#c0392b;color:#fff;
  border:none;border-radius:6px;font-size:.75rem;font-weight:600;
  cursor:pointer;flex-shrink:0;transition:.12s;
}
.btn-del:active{opacity:.8}
.lobby-actions{display:flex;gap:10px;width:100%;margin-top:8px}
.lobby-actions button{
  flex:1;padding:12px;background:var(--accent);color:#0f0f13;
  border:none;border-radius:10px;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:.12s;
}
.lobby-actions button:active{opacity:.8}
.lobby-actions .sec{
  background:var(--card);color:var(--text);
}

/* ========== game panel ========== */
#game{max-width:480px;gap:8px}
#game .top{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:4px 0 6px;
}
#game .top-left{display:flex;gap:8px;align-items:center}
#game .top-left button{
  background:rgba(255,255,255,.08);color:var(--dim);
  border:none;padding:6px 10px;border-radius:6px;font-size:.7rem;
  cursor:pointer;transition:.12s;font-weight:500;
}
#game .top-left button:active{background:rgba(255,255,255,.15)}
#game .top-right{display:flex;gap:4px;align-items:center}
.turn-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:6px;
  background:rgba(255,255,255,.06);
}
.turn-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.board-wrap{
  position:relative;
  width:min(88vw,420px);
  height:min(88vw,420px);
}
#board{
  width:100%;height:100%;
  display:grid;gap:min(1.2vw,5px);
  touch-action:manipulation;
}
.cell{
  background:rgba(255,255,255,.05);
  border-radius:min(2.2vw,10px);
  position:relative;cursor:pointer;
  transition:background .12s;
}
.cell.highlight{background:rgba(255,255,255,.12)}
.cell .bg{
  position:absolute;inset:0;
  border-radius:min(2.2vw,10px);opacity:.15;
  transition:.2s;
}
.cell .piece{
  position:absolute;width:76%;height:76%;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.cell .piece.pop{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(0)}
  70%{transform:translate(-50%,-50%) scale(1.12)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
/* 爆炸闪烁 */
.cell.explode{animation:explode .35s ease}
@keyframes explode{
  0%{background:rgba(255,255,255,.4)}
  50%{background:rgba(255,255,255,.7)}
  100%{background:rgba(255,255,255,.05)}
}
.cell .dot{
  position:absolute;width:20%;height:20%;
  border-radius:50%;background:rgba(255,255,255,.88);
  transform:translate(-50%,-50%);
}

/* player colours — muted, warm */
.p0{background:#e8645a}
.p1{background:#e8b84b}
.p2{background:#5ab8e8}
.p3{background:#6bc46b}
.p4{background:#b07ce8}
.p5{background:#e87ab8}
.p6{background:#5cc9a9}

/* ========== msg ========== */
#msg{
  font-size:.75rem;padding:4px 10px;border-radius:6px;
  transition:.2s;min-height:1.5rem;
}
#msg.error{background:#c0392b;color:#fff}
#msg.success{background:#27ae60;color:#fff}

/* ========== modal ========== */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  justify-content:center;align-items:center;z-index:1000;padding:16px;
}
.modal.show{display:flex}
.modal-inner{
  background:var(--surface);
  padding:24px;border-radius:var(--radius);
  width:100%;max-width:360px;
  animation:modalIn .2s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-inner h3{font-size:1.05rem;font-weight:600;text-align:center;margin-bottom:16px}
.form-row{margin:10px 0;display:flex;flex-direction:column;gap:4px}
.form-row label{font-size:.8rem;color:var(--dim)}
.form-row input,.form-row select{
  width:100%;padding:10px 12px;
  border:1px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,.04);color:var(--text);
  font-size:.9rem;outline:none;transition:.12s;
}
.form-row input:focus,.form-row select:focus{
  border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,179,75,.15);
}
.form-row select option{background:var(--surface);color:var(--text)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions button{
  flex:1;padding:10px;border:none;border-radius:8px;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.12s;
}
.modal-actions button:active{opacity:.75}
.btn-primary{background:var(--accent);color:#0f0f13}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--dim)}

/* ========== game-over ========== */
.game-over{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:12px;z-index:999;padding:20px;
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.game-over h2{font-size:1.6rem}
.game-over p{font-size:.95rem;color:var(--dim)}
.game-over button{
  margin-top:8px;padding:12px 28px;
  background:var(--accent);color:#0f0f13;
  border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;
}
/* ========== local player area ========== */
.player-bar{
  display:flex;gap:6px;width:min(88vw,420px);margin:6px 0;
  flex-wrap:wrap;justify-content:center;
}
.player-tag{
  padding:4px 10px;border-radius:6px;
  font-size:.7rem;font-weight:600;
  opacity:.35;transition:.2s;
  border:1px solid transparent;
  white-space:nowrap;
}
.player-tag .cnt{
  display:inline-block;min-width:1.1em;
  text-align:center;margin-left:4px;
  font-size:.8rem;font-weight:700;
}
.player-tag.active{opacity:1;border-color:rgba(255,255,255,.15);transform:scale(1.04)}
.player-tag.elim{opacity:.15;text-decoration:line-through}

/* ========== responsive — tablets landscape ========== */
@media(min-width:900px)and(orientation:landscape){
  body{padding:20px}
  #game{max-width:640px;flex-direction:row;flex-wrap:wrap;justify-content:center}
  .board-wrap{width:min(55vw,500px);height:min(55vw,500px)}
  #board{gap:min(1vw,4px)}
  #game .top{width:100%}
  .player-bar{width:min(55vw,500px)}
}
/* ========== responsive — phones portrait ========== */
@media(max-width:480px){
  html{font-size:clamp(13px,4.5vw,16px)}
  body{padding:8px}
  .board-wrap{width:min(94vw,400px);height:min(94vw,400px)}
  #board{gap:min(1.5vw,4px)}
}
/* ========== small screens ========== */
@media(max-width:360px){
  .board-wrap{width:96vw;height:96vw}
  #game .top-left button{font-size:.65rem;padding:4px 7px}
}

/* ========== settlement page ========== */
.settlement{
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;overflow-y:auto;
  animation:fadeIn .4s ease;
}
.settlement-inner{
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.settlement h2{font-size:1.5rem;margin:8px 0 4px;text-align:center}
.settlement .winner-color{
  display:inline-block;width:14px;height:14px;
  border-radius:50%;vertical-align:middle;margin-right:6px;
}
.settlement .stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:8px;width:100%;
}
.settlement .stat-card{
  background:rgba(255,255,255,.06);border-radius:10px;
  padding:10px 8px;text-align:center;
}
.settlement .stat-card .color-dot{
  display:inline-block;width:10px;height:10px;
  border-radius:50%;margin-right:4px;vertical-align:middle;
}
.settlement .stat-card .name{font-size:.8rem;font-weight:600}
.settlement .stat-card .num{font-size:1.1rem;font-weight:700;margin-top:2px}
.settlement .stat-card .lbl{font-size:.65rem;color:var(--dim)}
.settlement .chart-box{
  width:100%;background:rgba(255,255,255,.04);
  border-radius:10px;padding:10px;
}
.settlement .chart-box h4{font-size:.8rem;font-weight:500;margin-bottom:6px;text-align:center;color:var(--dim)}
.settlement .chart-box canvas{width:100%;height:150px;display:block}
.settlement .chart-legend{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin-top:4px;
}
.settlement .chart-legend span{
  font-size:.65rem;display:inline-flex;align-items:center;gap:3px;
}
.settlement .chart-legend .leg-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;
}
.settlement .btn-again{
  padding:12px 32px;background:var(--accent);color:#0f0f13;
  border:none;border-radius:10px;font-size:.95rem;font-weight:600;
  cursor:pointer;margin:8px 0 16px;transition:.12s;
}
.settlement .btn-again:active{opacity:.8}
</style>
</head>
<body>

<!-- ===== SCREENS ===== -->

<!-- Welcome -->
<div id="welcome" class="screen active">
  <div class="logo">♟<span>连锁棋</span></div>
  <div class="tagline">多⼈连⼿，⼀触即发</div>
  <div class="mode-cards">
    <div class="mode-card" onclick="showLocalLobby()">
      <div class="icon">📱</div>
      <div class="body">
        <h3>本地对战</h3>
        <p>同⼀设备，轮流落⼦，朋友⾯前⼤战</p>
      </div>
    </div>
    <div class="mode-card" onclick="showOnlineLobby()">
      <div class="icon">🌐</div>
      <div class="body">
        <h3>在线联机</h3>
        <p>远程好友，创建或加⼊房间</p>
      </div>
    </div>
  </div>
</div>

<!-- Online Lobby -->
<div id="lobby" class="screen">
  <button class="back" onclick="goHome()">← 返回</button>
  <h2>🌐 在线联机</h2>

  <div class="section-header">
    <strong>房间列表</strong>
    <button class="btn-sm" onclick="getRoomList()">↻ 刷新</button>
  </div>
  <div id="roomList" class="list-box"><div class="empty">点击刷新获取房间列表</div></div>

  <div class="section-header" style="margin-top:2px">
    <strong>我的存档</strong>
    <button class="btn-sm" onclick="getSaveList()">↻ 刷新</button>
  </div>
  <div id="saveList" class="list-box"><div class="empty">点击刷新获取存档列表</div></div>

  <div class="lobby-actions">
    <button class="sec" onclick="joinRandomRoom()">快速加入</button>
    <button onclick="openModal('createModal')">＋ 创建房间</button>
  </div>
</div>

<!-- Local Lobby -->
<div id="localLobby" class="screen">
  <button class="back" onclick="goHome()">← 返回</button>
  <h2>📱 本地对战</h2>
  <p style="font-size:.85rem;color:var(--dim);margin:4px 0 12px">选择对局配置</p>

  <div class="form-row"><label>棋盘大小</label>
    <select id="localSize">
      <option value="5">5×5</option>
      <option value="6">6×6</option>
      <option value="7" selected>7×7</option>
      <option value="8">8×8</option>
      <option value="9">9×9</option>
      <option value="10">10×10</option>
      <option value="11">11×11</option>
      <option value="12">12×12</option>
      <option value="13">13×13</option>
      <option value="14">14×14</option>
      <option value="15">15×15</option>
      <option value="16">16×16</option>
      <option value="17">17×17</option>
      <option value="18">18×18</option>
      <option value="19">19×19</option>
    </select>
  </div>
  <div class="form-row"><label>玩家人数（含 AI）</label>
    <select id="localPlayers">
      <option value="2" selected>2 人</option>
      <option value="3">3 人</option>
      <option value="4">4 人</option>
      <option value="5">5 人</option>
      <option value="6">6 人</option>
      <option value="7">7 人</option>
    </select>
  </div>
  <div class="form-row"><label>AI 对手数</label>
    <select id="localAI" onchange="toggleAISettings()">
      <option value="0">0（纯人⼈对战）</option>
      <option value="1" selected>1 个 AI</option>
      <option value="2">2 个 AI</option>
      <option value="3">3 个 AI</option>
      <option value="4">4 个 AI</option>
      <option value="5">5 个 AI</option>
      <option value="6">6 个 AI</option>
    </select>
  </div>
  <div id="aiSettings" style="display:block">
    <div class="form-row"><label>AI 算法</label>
      <select id="aiAlgorithm" onchange="toggleAIDepth()">
        <option value="strategy">策略算法</option>
        <option value="alphabeta">Alpha-Beta 剪枝</option>
      </select>
    </div>
    <div id="aiDepthRow" class="form-row"><label>搜索深度</label>
      <select id="aiDepth">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>
  </div>
  <p style="font-size:.7rem;color:var(--dim);margin:4px 0">AI 会自动按顺序占⽤最后几个位置</p>
  <button style="width:100%;padding:12px;background:var(--accent);color:#0f0f13;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:12px" onclick="startLocalGame()">开始游戏</button>
</div>

<!-- Game Screen -->
<div id="game" class="screen">
  <div class="top">
    <div class="top-left">
      <button onclick="exitGame()">← 退出</button>
      <button onclick="openModal('resetModal')">↻ 重开</button>
      <button onclick="openModal('saveModal')" id="saveBtn" style="display:none">💾 存档</button>
    </div>
    <div class="top-right">
      <span id="msg"></span>
    </div>
  </div>
  <div id="playerBar" class="player-bar"></div>
  <div class="board-wrap"><div id="board"></div></div>
</div>

<!-- ===== MODALS ===== -->

<div id="createModal" class="modal">
  <div class="modal-inner">
    <h3>创建房间</h3>
    <div class="form-row"><label>房间名</label><input id="roomName" value="我的房间"></div>
    <div class="form-row"><label>密码（可选）</label><input id="roomPwd" type="password" placeholder="留空则无密码"></div>
    <div class="form-row"><label>棋盘大小</label>
      <select id="createSize">
        <option value="5">5×5</option><option value="6">6×6</option><option value="7" selected>7×7</option>
        <option value="8">8×8</option><option value="9">9×9</option><option value="10">10×10</option>
        <option value="11">11×11</option><option value="12">12×12</option><option value="13">13×13</option>
        <option value="14">14×14</option><option value="15">15×15</option><option value="16">16×16</option>
        <option value="17">17×17</option><option value="18">18×18</option><option value="19">19×19</option>
      </select>
    </div>
    <div class="form-row"><label>玩家数</label>
      <select id="createPlayers">
        <option value="2" selected>2 人</option><option value="3">3 人</option><option value="4">4 人</option>
        <option value="5">5 人</option><option value="6">6 人</option><option value="7">7 人</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('createModal')">取消</button>
      <button class="btn-primary" onclick="confirmCreate()">创建</button>
    </div>
  </div>
</div>

<div id="pwdModal" class="modal">
  <div class="modal-inner">
    <h3>输入密码</h3>
    <div class="form-row"><label>密码</label><input id="joinPwd" type="password" placeholder="输入房间密码"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('pwdModal')">取消</button>
      <button class="btn-primary" onclick="confirmPwd()">加入</button>
    </div>
  </div>
</div>

<div id="resetModal" class="modal">
  <div class="modal-inner">
    <h3>重新开始</h3>
    <div class="form-row"><label>棋盘大小</label>
      <select id="resetSize">

<script>
/* ==================== CONSTANTS & STATE ==================== */
// 颜色 — 调高对比度，更鲜艳
const COLORS=['#e8645a','#f0c040','#40b8f0','#50d060','#c080f0','#f070c0','#50d0b0'];
const COLORS_LIGHT=['rgba(232,100,90,.08)','rgba(240,192,64,.08)','rgba(64,184,240,.08)','rgba(80,208,96,.08)','rgba(192,128,240,.08)','rgba(240,112,192,.08)','rgba(80,208,176,.08)'];
// 颜色名称（用于结算页显示）
const COLOR_NAMES = ['红色', '黄色', '蓝色', '绿色', '紫色', '粉色', '青色'];

// ========== 音效 (Web Audio API) ==========
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}
function playTone(freq, duration, type, volume) {
  try {
    let ctx = getAudioCtx(); if (!ctx) return;
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume || 0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function playClick() { playTone(800, 0.08, 'sine', 0.12) }
function playExplosion() { playTone(150, 0.25, 'sawtooth', 0.15) }
function playElim() {
  playTone(400, 0.15, 'square', 0.08);
  setTimeout(() => playTone(300, 0.15, 'square', 0.08), 120);
  setTimeout(() => playTone(200, 0.2, 'square', 0.08), 240);
}
function playGameOver() {
  playTone(523, 0.15, 'sine', 0.12);
  setTimeout(() => playTone(659, 0.15, 'sine', 0.12), 150);
  setTimeout(() => playTone(784, 0.3, 'sine', 0.15), 300);
}

// game state
let board=[],curPlayer=0,size=7,maxPlayers=2;
let cells=[];
let gameMode=null; // 'local'|'online'
let gameOver=false;
let totalUsers=0;
let meta={};
let aiPlayers=new Set(); // indices of AI-controlled players
let aiThinking=false;    // prevent re-entry
let aiAlgorithm='strategy'; // 'strategy' | 'alphabeta'
let aiDepth=2;
let eliminatedPlayers=new Set(); // persistent across turns
let gameHistory=[]; // 本地历史记录 [{turn, snapshot:{p:{pieces,points}}}]
let pendingHistory=null; // 来自服务器的历史
let pendingColorNames=null; // 来自服务器的颜色名称

// online
let ws=null,inRoom=false,roomId=null,wsReady=false,wsQueue=[];
let pendingRid=null,pendSaveId=null,pendSaveAct=null;

/* ==================== SCREEN MGMT ==================== */
function show(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));document.getElementById(s).classList.add('active')}
function goHome(){exitGame();show('welcome')}

/* ==================== LOCAL ==================== */
function showLocalLobby(){show('localLobby')}

function toggleAISettings(){
  let v=parseInt(document.getElementById('localAI').value)||0;
  document.getElementById('aiSettings').style.display=v>0?'block':'none';
}
function toggleAIDepth(){
  let alg=document.getElementById('aiAlgorithm').value;
  document.getElementById('aiDepthRow').style.display=alg==='alphabeta'?'block':'none';
}

function cap(i,j,s){return 4} // 统一：4级起爆，边界不足的邻居丢弃
function nbrs(i,j,s){let r=[];if(i>0)r.push([i-1,j]);if(i<s-1)r.push([i+1,j]);if(j>0)r.push([i,j-1]);if(j<s-1)r.push([i,j+1]);return r}
// 8方向邻居（包括斜角）
function nbrs8(i,j,s){let r=[];for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(di===0&&dj===0)continue;let ni=i+di,nj=j+dj;if(ni>=0&&ni<s&&nj>=0&&nj<s)r.push([ni,nj])}return r}
function mkBoard(s){return Array.from({length:s},()=>Array.from({length:s},()=>({owner:null,count:0})))}
// 玩家是否有棋子
function hasPieces(p,b){for(let r of b)for(let c of r)if(c.owner===p)return true;return false}
// 某格是否紧邻（8方向）任何棋子
function nearAny(i,j,s,b){for(let[ni,nj]of nbrs8(i,j,s)){if(b[ni][nj].owner!==null)return true}return false}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function recordHistory(){
  let sn={};
  for(let p=0;p<maxPlayers;p++){
    let pieces=0,points=0;
    for(let r of board)for(let c of r)if(c.owner===p){pieces++;points+=c.count}
    sn[p]={pieces,points};
  }
  gameHistory.push({turn:gameHistory.length,snapshot:sn});
}

async function processClick(b,s,x,y,pl,anim){
  let c=b[x][y];
  if(c.owner===null){
    let first = !hasPieces(pl,b);
    c.owner=pl;
    c.count=first?3:1;
  }
  else if(c.owner===pl)c.count++
  else return [];
  let had=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)had.add(cl.owner);
  let chain=[[x,y]];
  while(chain.length){
    let [cx,cy]=chain.shift(),cell=b[cx][cy],capv=cap(cx,cy,s);
    if(cell.count>=capv){
      cell.count=0;cell.owner=null;
      playExplosion();
      for(let [nx,ny] of nbrs(cx,cy,s)){
        let nc=b[nx][ny];nc.owner=pl;nc.count++;chain.push([nx,ny]);
      }
      // 每步爆炸后闪烁、渲染、停顿，展示连锁过程
      if(anim){
        let el=cells?.[cx]?.[cy];if(el)el.classList.add('explode');
        renderBoard(false,anim==='pop'?cx:undefined);
        await sleep(180);
        if(el)el.classList.remove('explode');
      }
    }
  }
  let now=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)now.add(cl.owner);
  return [...had].filter(p=>!now.has(p));
}

/* 同步版落子（不含动画/音效，专供搜索使用） */
function processClickSync(b,s,x,y,pl){
  let c=b[x][y];
  if(c.owner===null){
    let first=!hasPieces(pl,b);
    c.owner=pl;
    c.count=first?3:1;
  }else if(c.owner===pl)c.count++;
  else return[];
  let had=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)had.add(cl.owner);
  let chain=[[x,y]];
  while(chain.length){
    let[cx,cy]=chain.shift(),cell=b[cx][cy],capv=cap(cx,cy,s);
    if(cell.count>=capv){
      cell.count=0;cell.owner=null;
      for(let[nx,ny]of nbrs(cx,cy,s)){
        let nc=b[nx][ny];nc.owner=pl;nc.count++;chain.push([nx,ny]);
      }
    }
  }
  let now=new Set();
  for(let row of b)for(let cl of row)if(cl.owner!==null)now.add(cl.owner);
  return[...had].filter(p=>!now.has(p));
}

function startLocalGame(){
  size=parseInt(document.getElementById('localSize').value)||7;
  maxPlayers=parseInt(document.getElementById('localPlayers').value)||2;
  let aiCount=parseInt(document.getElementById('localAI').value)||0;
  if(aiCount>=maxPlayers)aiCount=maxPlayers-1;
  aiAlgorithm=document.getElementById('aiAlgorithm').value;
  aiDepth=parseInt(document.getElementById('aiDepth').value)||2;
  board=mkBoard(size);curPlayer=0;gameOver=false;
  gameMode='local';
  inRoom=false;
  aiPlayers=new Set();
  for(let p=maxPlayers-aiCount;p<maxPlayers;p++)aiPlayers.add(p);
  aiThinking=false;
  eliminatedPlayers=new Set();
  gameHistory=[];
  recordHistory();
  renderBoard(true);
  show('game');
  document.body.style.background='';
  renderPlayerBar();
  // if first player is AI, trigger
  if(aiPlayers.has(0))setTimeout(()=>triggerAI(),400);
}

function startLocalReset(){
  size=parseInt(document.getElementById('resetSize').value)||size;
  maxPlayers=parseInt(document.getElementById('resetPlayers').value)||maxPlayers;
  board=mkBoard(size);curPlayer=0;gameOver=false;
  aiThinking=false;
  eliminatedPlayers=new Set();
  gameHistory=[];
  recordHistory();
  renderBoard(true);
  renderPlayerBar();
  document.body.style.background='';
  closeModal('resetModal');
  document.querySelectorAll('.game-over,.settlement').forEach(e=>e.remove());
  if(aiPlayers.has(0))setTimeout(()=>triggerAI(),400);
}

async function localClick(x,y){
  if(gameOver||gameMode!=='local'||aiThinking)return;
  if(aiPlayers.has(curPlayer))return;
  let c=board[x][y];
  let mine=hasPieces(curPlayer,board);
  // 有棋子 → 只能点自己的格子
  if(mine){
    if(c.owner!==curPlayer){showMsg('只能点击自己的棋子','');return}
  }
  // 没棋子 → 可以下空格，但不能紧邻任何已有棋子
  else{
    if(c.owner!==null){showMsg('不能抢占别人的格子','');return}
    if(nearAny(x,y,size,board)){showMsg('不能在已有棋子旁边落子','');return}
  }
  playClick();
  let elim=await processClick(board,size,x,y,curPlayer,'pop');
  // 将被本轮淘汰的记入持久集
  for(let e of elim){eliminatedPlayers.add(e);playElim()}
  recordHistory();
  renderBoard(false,x,y);
  // 存活玩家 = 所有未被淘汰的玩家
  let alive=[];
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    alive.push(p);
  }
  if(alive.length<=1){
    gameOver=true;
    playGameOver();
    showSettlement(alive[0], COLOR_NAMES, gameHistory);
    return;
  }
  // 找当前玩家在存活列表中的位置
  let idx=alive.indexOf(curPlayer);
  if(idx<0)idx=0;
  curPlayer=alive[(idx+1)%alive.length];
  renderPlayerBar();
  setBg(curPlayer);
  // trigger AI if next player is AI
  if(aiPlayers.has(curPlayer))setTimeout(()=>triggerAI(),500);
}

/* ==================== RENDER ==================== */
function renderBoard(force,popX,popY){
  let bd=document.getElementById('board');
  if(force||cells.length!==size){
    bd.innerHTML='';
    bd.style.gridTemplateColumns=`repeat(${size},1fr)`;
    cells=[];
    for(let i=0;i<size;i++){
      let row=[];
      for(let j=0;j<size;j++){
        let el=document.createElement('div');el.className='cell';
        el.onclick=()=>handleClick(i,j);
        bd.appendChild(el);row.push(el);
      }
      cells.push(row);
    }
  }
  for(let i=0;i<size;i++)for(let j=0;j<size;j++){
    let el=cells[i][j],d=board[i][j];
    el.innerHTML='';
    if(d.owner!==null){
      if(d.owner===curPlayer){
        let bg=document.createElement('div');bg.className='bg p'+d.owner;
        el.appendChild(bg);
      }
      let p=document.createElement('div');p.className='piece p'+d.owner;
      el.appendChild(p);
      drawDots(p,d.count);
      if(popX!==undefined&&i===popX&&j===popY)p.classList.add('pop');
    }
  }
}

function drawDots(p,n){
  let cx=50,cy=50,r=30;
  if(n===1)addDot(p,cx,cy);
  else if(n===2){addDot(p,cx-20,cy);addDot(p,cx+20,cy)}
  else if(n===3){let h=Math.sqrt(3)/2;addDot(p,cx,cy-r*h/2);addDot(p,cx-r/2,cy+r*h/2);addDot(p,cx+r/2,cy+r*h/2)}
  else{addDot(p,34,34);addDot(p,66,34);addDot(p,34,66);addDot(p,66,66)}
}
function addDot(p,x,y){let d=document.createElement('div');d.className='dot';d.style.left=x+'%';d.style.top=y+'%';p.appendChild(d)}
function setBg(pl){let h=COLORS[pl];let r=parseInt(h.substr(1,2),16)*.85,g=parseInt(h.substr(3,2),16)*.85,b=parseInt(h.substr(5,2),16)*.85;document.body.style.background=`rgb(${r|0},${g|0},${b|0})`}

function renderPlayerBar(){
  let el=document.getElementById('playerBar');el.innerHTML='';
  // 统计每个玩家占据的格子数
  let cnt={};
  for(let p=0;p<maxPlayers;p++)cnt[p]=0;
  for(let row of board)for(let c of row)if(c.owner!==null)cnt[c.owner]++;

  for(let p=0;p<maxPlayers;p++){
    let t=document.createElement('span');t.className='player-tag';
    if(p===curPlayer)t.classList.add('active');
    let alive=cnt[p]>0;
    if(!alive&&gameMode==='local'&&board.some(r=>r.some(c=>c.owner!==null)))t.classList.add('elim');
    t.style.background=COLORS_LIGHT[p];
    t.style.color=COLORS[p];
    let label=aiPlayers.has(p)?`AI ${p+1}`:`玩家 ${p+1}`;
    t.innerHTML=`${label} <span class="cnt">${cnt[p]}</span>`;
    el.appendChild(t);
  }
}

/* ==================== AI ENGINE ==================== */

/* 获取某格上下左右邻居中，指定等级的对手棋子数 */
function countOpponentLevelAround(b, sz, i, j, player, level) {
  let cnt = 0;
  for (let [ni, nj] of nbrs(i, j, sz)) {
    let nc = b[ni][nj];
    if (nc.owner !== null && nc.owner !== player && nc.count === level) cnt++;
  }
  return cnt;
}

/* 检查某格四周（上下左右）是否有指定等级的对手棋子 */
function hasOpponentLevelNear(b, sz, i, j, player, level) {
  for (let [ni, nj] of nbrs(i, j, sz)) {
    let nc = b[ni][nj];
    if (nc.owner !== null && nc.owner !== player && nc.count === level) return true;
  }
  return false;
}

function aiFindMove(player, sz, b) {
  let mine = [];
  for (let i = 0; i < sz; i++) for (let j = 0; j < sz; j++)
    if (b[i][j].owner === player) mine.push([i, j]);

  // 没有棋子 → 首回合落子（不靠边角）
  if (mine.length === 0) {
    let candidates = [];
    // 先只考虑非边角的格子
    for (let i = 1; i < sz - 1; i++) for (let j = 1; j < sz - 1; j++)
      if (b[i][j].owner === null && !nearAny(i, j, sz, b))
        candidates.push([i, j]);
    // 如果中间没有合法位置，才回退到边角
    if (candidates.length === 0) {
      for (let i = 0; i < sz; i++) for (let j = 0; j < sz; j++)
        if (b[i][j].owner === null && !nearAny(i, j, sz, b))
          candidates.push([i, j]);
    }
    if (candidates.length === 0) return null;
    // 选最靠近中心的
    let cx = sz / 2 - 0.5, cy = sz / 2 - 0.5;
    return candidates.reduce((a, b2) => {
      let da = Math.abs(a[0] - cx) + Math.abs(a[1] - cx);
      let db = Math.abs(b2[0] - cx) + Math.abs(b2[1] - cx);
      return da <= db ? a : b2;
    });
  }

  // ========== 策略落子 ==========

  // 1. 查找所有三级棋子 (count===3)
  let lv3 = mine.filter(([i, j]) => b[i][j].count === 3);

  // 2. 选择周围（上下左右）对手三级棋子最多的落子（至少1个）
  if (lv3.length > 0) {
    let best = null, bestCnt = 0;
    for (let [i, j] of lv3) {
      let cnt = countOpponentLevelAround(b, sz, i, j, player, 3);
      if (cnt > bestCnt) { bestCnt = cnt; best = [i, j]; }
    }
    if (bestCnt >= 1) return best;
  }

  // 3. 如果没有三级棋子或所有三级棋子周围都没有对手三级棋子，
  //    找周围没有对手三级棋子的二级棋子 (count===2)
  let lv2 = mine.filter(([i, j]) => b[i][j].count === 2);
  let safeLv2 = lv2.filter(([i, j]) => !hasOpponentLevelNear(b, sz, i, j, player, 3));
  if (safeLv2.length > 0) {
    // 偏好离对手三级棋子较远的；若无对手三级，优先级最高的二级棋子
    let best = null, bestScore = -Infinity;
    for (let [i, j] of safeLv2) {
      let edge = ((i === 0 || i === sz - 1) || (j === 0 || j === sz - 1)) ? 3 : 0;
      let corner = ((i === 0 || i === sz - 1) && (j === 0 || j === sz - 1)) ? 5 : 0;
      let nearAnyOpp = 0;
      for (let [ni, nj] of nbrs(i, j, sz)) {
        let nc = b[ni][nj];
        if (nc.owner !== null && nc.owner !== player) nearAnyOpp++;
      }
      let score = edge + corner - nearAnyOpp * 5 + Math.random() * 1;
      if (score > bestScore) { bestScore = score; best = [i, j]; }
    }
    return best;
  }

  // 4. 如果没有，就一进二 (count===1 → click to make count===2)
  let lv1 = mine.filter(([i, j]) => b[i][j].count === 1);
  if (lv1.length > 0) {
    // 优先选择安全的（周围对手棋子少的）
    let best = null, bestScore = -Infinity;
    for (let [i, j] of lv1) {
      let nearOpp = 0;
      for (let [ni, nj] of nbrs(i, j, sz)) {
        let nc = b[ni][nj];
        if (nc.owner !== null && nc.owner !== player) nearOpp++;
      }
      let score = -nearOpp * 3 + Math.random() * 2;
      if (score > bestScore) { bestScore = score; best = [i, j]; }
    }
    return best;
  }

  // 5. 如果没有，就下三级棋子 (count===2 → click to make count===3)
  let anyLv2 = lv2.length > 0 ? lv2 : null;
  if (anyLv2) {
    // 优先选择的二级棋子中离对手较近的（准备爆炸）
    let best = null, bestScore = -Infinity;
    for (let [i, j] of anyLv2) {
      let nearOpp = 0;
      for (let [ni, nj] of nbrs(i, j, sz)) {
        let nc = b[ni][nj];
        if (nc.owner !== null && nc.owner !== player) nearOpp += 5;
      }
      let edge = ((i === 0 || i === sz - 1) || (j === 0 || j === sz - 1)) ? 2 : 0;
      let score = nearOpp + edge + Math.random() * 1;
      if (score > bestScore) { bestScore = score; best = [i, j]; }
    }
    return best;
  }

  // 6. 如果没有，就随机落子
  let available = mine.filter(([i, j]) => b[i][j].count < cap(i, j, sz));
  if (available.length > 0) return available[Math.floor(Math.random() * available.length)];

  return mine[0];
}

/* ==================== ALPHA-BETA 剪枝 ==================== */
function cloneBoard(b){
  return b.map(row=>row.map(c=>({owner:c.owner,count:c.count})));
}

/* 评估函数：根据己方棋子数与对手棋子数判断 */
function evaluateBoard(b,sz,player){
  let myScore=0,oppScore=0,oppCount=0;
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(c.owner===player)myScore+=c.count;
    else if(c.owner!==null){oppScore+=c.count;oppCount++;}
  }
  // 基础差值 + 占据格数奖励
  let diff=myScore-oppScore;
  let territory=0;
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(c.owner===player)territory++;
    else if(c.owner!==null)territory--;
  }
  return diff*2+territory;
}

/* 获取某玩家的所有合法落子 */
function getPlayerMoves(b,sz,player){
  let hasP=hasPieces(player,b);
  let moves=[];
  for(let i=0;i<sz;i++)for(let j=0;j<sz;j++){
    let c=b[i][j];
    if(hasP){
      if(c.owner===player&&c.count<cap(i,j,sz))moves.push([i,j]);
    }else{
      if(c.owner===null&&!nearAny(i,j,sz,b))moves.push([i,j]);
    }
  }
  return moves;
}

/* 获取下一个存活玩家 */
function getNextAlive(current,elim,sz,pl){
  for(let i=1;i<=sz;i++){
    let next=(current+i)%sz;
    if(!elim.has(next)&&pl.includes(next))return next;
  }
  return current;
}

/* 对走法排序（吃子/高等级优先），提高剪枝效率 */
function orderMoves(moves,b,sz,player,isMax){
  return moves.sort((a,b2)=>{
    let ca1=b[a[0]][a[1]].count,cb1=b[b2[0]][b2[1]].count;
    let priorityA=ca1*10,priorityB=cb1*10;
    // 爆炸前的棋子优先
    if(ca1>=3)priorityA+=100;
    if(cb1>=3)priorityB+=100;
    // 周围对手多的优先
    let nearA=0,nearB=0;
    for(let[ni,nj]of nbrs(a[0],a[1],sz)){
      let nc=b[ni][nj];
      if(nc.owner!==null&&nc.owner!==player)nearA+=nc.count;
    }
    for(let[ni,nj]of nbrs(b2[0],b2[1],sz)){
      let nc=b[ni][nj];
      if(nc.owner!==null&&nc.owner!==player)nearB+=nc.count;
    }
    priorityA+=nearA*5;priorityB+=nearB*5;
    return priorityB-priorityA; // 降序
  });
}

/* Alpha-Beta 递归搜索 */
function alphaBeta(b,sz,player,depth,maxDepth,alpha,beta,aiPlayer,startTime,timeLimit,alivePlayers,elimSet){
  // 超时或到达深度 → 评估
  if(depth>=maxDepth||Date.now()-startTime>timeLimit) return {score:evaluateBoard(b,sz,aiPlayer)};
  
  let moves=getPlayerMoves(b,sz,player);
  if(moves.length===0) return {score:evaluateBoard(b,sz,aiPlayer)};
  // 只有一步可走，直接走（不用搜索）
  if(moves.length===1) return {score:evaluateBoard(b,sz,aiPlayer), move:moves[0]};
  
  // 走法排序
  let ordered=orderMoves(moves,b,sz,player,player===aiPlayer);
  // 限制每层最多搜 10 个走法，大幅减少搜索量
  if(ordered.length>10) ordered=ordered.slice(0,10);
  
  let isMax=player===aiPlayer;
  let best=isMax?{score:-Infinity}:{score:Infinity};
  
  for(let[i,j]of ordered){
    let nb=cloneBoard(b);
    let elim=processClickSync(nb,sz,i,j,player);
    let newElim=new Set(elimSet);
    for(let e of elim)newElim.add(e);
    
    // 检查游戏是否结束
    let alive=alivePlayers.filter(p=>!newElim.has(p));
    if(alive.length<=1){
      let sc=isMax?Infinity:-Infinity;
      if(isMax&&sc>best.score){best={score:sc,move:[i,j]}}
      else if(!isMax&&sc<best.score){best={score:sc,move:[i,j]}}
      continue;
    }
    
    // 下一个玩家
    let nextIdx=alive.indexOf(player);
    let nextPlayer=alive[(nextIdx+1)%alive.length];
    
    let result=alphaBeta(nb,sz,nextPlayer,depth+1,maxDepth,alpha,beta,aiPlayer,startTime,timeLimit,alive,newElim);
    
    if(isMax){
      if(result.score>best.score){best={score:result.score,move:[i,j]}}
      alpha=Math.max(alpha,result.score);
    }else{
      if(result.score<best.score){best={score:result.score,move:[i,j]}}
      beta=Math.min(beta,result.score);
    }
    if(beta<=alpha)break; // 剪枝
  }
  
  return best;
}

/* Alpha-Beta 入口 */
function aiFindMoveAlphaBeta(player,sz,b,depth){
  let startTime=Date.now();
  let timeLimit=3000+depth*500; // 根据深度自动调整时间
  
  // 只有一步能下 → 直接返回
  let allMoves=getPlayerMoves(b,sz,player);
  if(allMoves.length===1) return allMoves[0];
  
  // 没有棋子 → 首回合落子
  if(!hasPieces(player,b)){
    let candidates=[];
    for(let i=0;i<sz;i++)for(let j=0;j<sz;j++)
      if(b[i][j].owner===null&&!nearAny(i,j,sz,b))
        candidates.push([i,j]);
    if(candidates.length===0)return null;
    let cx=sz/2-0.5;
    return candidates.reduce((a,b2)=>{
      let da=Math.abs(a[0]-cx)+Math.abs(a[1]-cx);
      let db=Math.abs(b2[0]-cx)+Math.abs(b2[1]-cx);
      return da<=db?a:b2;
    });
  }
  
  // 计算存活玩家
  let alivePlayers=[];
  for(let p=0;p<maxPlayers;p++){
    if(!eliminatedPlayers.has(p)&&(p===player||hasPieces(b,p)))alivePlayers.push(p);
  }
  if(alivePlayers.length<=1)return null;
  
  let result=alphaBeta(b,sz,player,0,depth,-Infinity,Infinity,player,startTime,timeLimit,alivePlayers,eliminatedPlayers);
  
  return result.move||null;
}

async function triggerAI(){
  if(gameOver||gameMode!=='local'||aiThinking)return;
  if(!aiPlayers.has(curPlayer))return;
  aiThinking=true;
  showMsg(`🤔 AI ${curPlayer+1} 思考中...`,'');

  // 让浏览器有机会渲染消息
  await sleep(50);

  let move;
  if(aiAlgorithm==='alphabeta'){
    move=aiFindMoveAlphaBeta(curPlayer,size,board,aiDepth);
  }else{
    move=aiFindMove(curPlayer,size,board);
  }
  if(!move){showMsg(`AI ${curPlayer+1} 无合法落子`,'error');aiThinking=false;return}

  let [x,y]=move;
  let el=cells[x][y];
  if(el)el.style.background='rgba(255,255,255,.15)';

  // short delay for visual feedback
  await new Promise(r=>setTimeout(r,350));

  if(el)el.style.background='';
  aiThinking=false;

  // execute AI move
  let c=board[x][y];
  if(c.owner!==null&&c.owner!==curPlayer){aiThinking=false;return}
  playClick();
  let elim=await processClick(board,size,x,y,curPlayer,'pop');
  for(let e of elim){eliminatedPlayers.add(e);playElim()}
  recordHistory();
  renderBoard(false,x,y);
  let alive=[];
  for(let p=0;p<maxPlayers;p++){
    if(eliminatedPlayers.has(p))continue;
    alive.push(p);
  }
  if(alive.length<=1){
    gameOver=true;
    playGameOver();
    showSettlement(alive[0], COLOR_NAMES, gameHistory);
    return;
  }
  let idx=alive.indexOf(curPlayer);
  if(idx<0)idx=0;
  curPlayer=alive[(idx+1)%alive.length];
  renderPlayerBar();
  setBg(curPlayer);

  // next AI in chain
  if(aiPlayers.has(curPlayer)&&!gameOver)setTimeout(()=>triggerAI(),400);
}

function getPlayerLabel(p){
  if(p===undefined||p===null)return '未知';
  return aiPlayers.has(p)?`AI ${p+1}`:`玩家 ${p+1}`;
}

function drawLineChart(canvas, history, colorNames, colors, valueKey, title) {
  if (!canvas || history.length < 2) return;
  let dpr = window.devicePixelRatio || 1;
  let rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  let ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  let w = rect.width, h = rect.height;
  let pad = { top: 18, right: 8, bottom: 22, left: 32 };
  let cw = w - pad.left - pad.right, ch = h - pad.top - pad.bottom;

  // 找所有玩家和最大值
  let players = new Set();
  let maxVal = 0;
  for (let turn of history) {
    for (let pidStr in turn.snapshot) {
      let pid = parseInt(pidStr);
      players.add(pid);
      let v = turn.snapshot[pidStr][valueKey];
      if (v > maxVal) maxVal = v;
    }
  }
  if (maxVal === 0) maxVal = 1;
  // 对玩家排序
  let sortedPlayers = [...players].sort((a, b) => a - b);

  // 背景网格
  ctx.strokeStyle = 'rgba(255,255,255,.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    let y = pad.top + (ch * i) / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
  }

  // Y 轴刻度
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    let y = pad.top + (ch * i) / 4;
    let val = Math.round(maxVal * (1 - i / 4));
    ctx.fillText(val, pad.left - 4, y + 3);
  }

  // X 轴标签
  ctx.textAlign = 'center';
  let turnCount = history.length;
  for (let i = 0; i < turnCount; i++) {
    if (turnCount > 15 && i % Math.ceil(turnCount / 10) !== 0) continue;
    let x = pad.left + (cw * i) / (turnCount - 1 || 1);
    ctx.fillText(i, x, h - 4);
  }

  // 画折线
  for (let pid of sortedPlayers) {
    let color = colors[pid] || '#888';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < history.length; i++) {
      let v = history[i].snapshot[String(pid)]?.[valueKey] || 0;
      let x = pad.left + (cw * i) / (history.length - 1 || 1);
      let y = pad.top + ch * (1 - v / maxVal);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function showSettlement(winner, colorNames, history) {
  // 清除旧的结算页
  document.querySelectorAll('.settlement,.game-over').forEach(e => e.remove());

  let overlay = document.createElement('div'); overlay.className = 'settlement';
  let inner = document.createElement('div'); inner.className = 'settlement-inner';

  // 获胜者标签
  let winnerLabel = '';
  if (winner !== null && winner !== undefined) {
    let cName = (colorNames && colorNames[winner]) || getPlayerLabel(winner);
    winnerLabel = `<span class="winner-color" style="background:${COLORS[winner]||'#888'}"></span>${cName}`;
  } else {
    winnerLabel = '平局';
  }
  let title = document.createElement('h2');
  title.innerHTML = `🏆 ${winnerLabel} 获胜`;

  // 统计卡片
  let statsGrid = document.createElement('div'); statsGrid.className = 'stats-grid';
  let lastSnap = history.length > 0 ? history[history.length - 1].snapshot : {};
  // 基于玩家顺序显示
  let displayPlayers = [];
  for (let p = 0; p < maxPlayers; p++) displayPlayers.push(p);
  for (let pid of displayPlayers) {
    let snap = lastSnap[String(pid)];
    let pieces = snap ? snap.pieces : 0;
    let points = snap ? snap.points : 0;
    let card = document.createElement('div'); card.className = 'stat-card';
    let isWinner = pid === winner;
    if (isWinner) card.style.border = `1px solid ${COLORS[pid] || '#888'}`;
    card.innerHTML = `
      <div class="name">
        <span class="color-dot" style="background:${COLORS[pid]||'#888'}"></span>
        ${(colorNames && colorNames[pid]) || getPlayerLabel(pid)}
        ${isWinner ? '👑' : ''}
      </div>
      <div class="num" style="color:${COLORS[pid]||'#888'}">${pieces}</div>
      <div class="lbl">棋子</div>
      <div class="num" style="color:${COLORS[pid]||'#888'}">${points}</div>
      <div class="lbl">点数</div>
    `;
    statsGrid.appendChild(card);
  }

  inner.appendChild(title);
  inner.appendChild(statsGrid);

  // 折线图 1: 棋子数变化
  if (history && history.length >= 2) {
    let chartBox1 = document.createElement('div'); chartBox1.className = 'chart-box';
    chartBox1.innerHTML = '<h4>📊 棋子数变化</h4><canvas id="chartPieces"></canvas>';
    let legend1 = document.createElement('div'); legend1.className = 'chart-legend';
    let sortedP = [...displayPlayers].sort((a, b) => a - b);
    for (let pid of sortedP) {
      let cName = (colorNames && colorNames[pid]) || getPlayerLabel(pid);
      let s = document.createElement('span');
      s.innerHTML = `<span class="leg-dot" style="background:${COLORS[pid]||'#888'}"></span>${cName}`;
      legend1.appendChild(s);
    }
    chartBox1.appendChild(legend1);
    inner.appendChild(chartBox1);

    let chartBox2 = document.createElement('div'); chartBox2.className = 'chart-box';
    chartBox2.innerHTML = '<h4>📊 点数变化</h4><canvas id="chartPoints"></canvas>';
    let legend2 = document.createElement('div'); legend2.className = 'chart-legend';
    for (let pid of sortedP) {
      let cName = (colorNames && colorNames[pid]) || getPlayerLabel(pid);
      let s = document.createElement('span');
      s.innerHTML = `<span class="leg-dot" style="background:${COLORS[pid]||'#888'}"></span>${cName}`;
      legend2.appendChild(s);
    }
    chartBox2.appendChild(legend2);
    inner.appendChild(chartBox2);
  }

  // 再来一局按钮
  let btn = document.createElement('button'); btn.className = 'btn-again';
  btn.textContent = '再来一局';
  btn.onclick = function () {
    overlay.remove();
    openModal('resetModal');
  };
  inner.appendChild(btn);

  overlay.appendChild(inner);
  document.body.appendChild(overlay);

  // 等 DOM 渲染后画图
  setTimeout(() => {
    drawLineChart(document.getElementById('chartPieces'), history, colorNames, COLORS, 'pieces');
    drawLineChart(document.getElementById('chartPoints'), history, colorNames, COLORS, 'points');
  }, 50);
}

function handleClick(x,y){
  if(gameMode==='local'){if(!aiThinking)localClick(x,y);return}
  if(ws&&inRoom)wsSend({type:"click",x,y});
}

/* ==================== ONLINE ==================== */
function showOnlineLobby(){
  show('lobby');
  document.getElementById('roomList').innerHTML='<div class="empty">加载中...</div>';
  if(!ws||ws.readyState!==WebSocket.OPEN){connectWS();setTimeout(getRoomList,500)}
  else getRoomList();
}

function wsUrl(){let p=window.location.protocol==='https:'?'wss:':'ws:';return p+'//'+window.location.host+'/ws'}
function connectWS(){
  if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
  ws=new WebSocket(wsUrl());
  wsReady=false;
  ws.onopen=()=>{wsReady=true;let q=wsQueue;wsQueue=[];q.forEach(m=>{try{ws.send(m)}catch(e){showMsg('发送失败','error')}})}
  ws.onmessage=e=>{
    let d;
    try{d=JSON.parse(e.data)}catch(_){showMsg('数据格式错误','error');return}
    if(d.type==='roomList'){renderRoomList(d.list);return}
    if(d.type==='saveList'){renderSaveList(d.list);return}
    if(d.type==='saveDeleted'){showMsg(d.msg,'success');getSaveList();return}
    if(d.type==='error'){showMsg(d.msg,'error');return}
    if(d.type==='saveSuccess'){showMsg(d.msg,'success');return}
    if(d.type==='loadSuccess'){showMsg(d.msg,'success');return}
    if(d.type==='loadError'){showMsg(d.msg,'error');return}
    if(d.gameOver){
      let cNames = d.colorNames || COLOR_NAMES;
      let hist = d.history || gameHistory;
      playGameOver();
      showSettlement(d.winner, cNames, hist);
      return
    }
    if(!inRoom)enterOnlineRoom();
    board=d.board;curPlayer=d.current;size=d.size;
    if(d.meta)meta=d.meta;
    if(d.totalUsers!==undefined)totalUsers=d.totalUsers;
    gameMode='online';
    renderBoard(true);
    gameOver=false;
    setBg(curPlayer);
    renderPlayerBar();
  };
  ws.onclose=()=>{
    wsReady=false;
    if(inRoom)setTimeout(connectWS,2000);
    else showMsg('连接断开，点击刷新重试','error');
  };
  ws.onerror=()=>showMsg('无法连接服务器，请确认服务在运行','error');
}
function wsSend(msg){
  let data=JSON.stringify(msg);
  if(wsReady){try{ws.send(data);return true}catch(e){showMsg('发送失败','error');return false}}
  else{wsQueue.push(data);connectWS();return false}
}

function enterOnlineRoom(){
  inRoom=true;gameMode='online';show('game');
  document.getElementById('saveBtn').style.display='';
}
function exitGame(){
  if(ws&&inRoom){
    wsSend({type:"exitRoom"});
    ws.onclose=null;ws.close();ws=null;
  }
  inRoom=false;gameMode=null;gameOver=false;
  document.getElementById('board').innerHTML='';cells=[];board=[];
  document.getElementById('saveBtn').style.display='none';
  document.body.style.background='';
  document.querySelectorAll('.game-over,.settlement').forEach(e=>e.remove());
  showMsg('','');
  show('welcome');
}

function getRoomList(){wsSend({type:"getRoomList"})}
function getSaveList(){wsSend({type:"getSaveList"})}

function renderRoomList(list){
  let el=document.getElementById('roomList');
  el.innerHTML=list.length===0?'<div class="empty">暂无房间</div>':'';
  list.forEach(item=>{
    let div=document.createElement('div');div.className='list-item';
    let hp=!!(item.meta.password&&item.meta.password.length>0);
    div.innerHTML=`<div class="item-info"><div class="title">${esc(item.meta.roomName)}${hp?'<span class="lock">🔒</span>':''}</div><div class="sub">ID:${item.roomId} · ${item.currentPlayers}/${item.meta.maxPlayers}⼈ · ${item.meta.size}×${item.meta.size}</div></div><button class="btn-join" onclick="event.stopPropagation();joinRoom(${item.roomId},${hp})">加入</button>`;
    el.appendChild(div);
  });
}
function renderSaveList(list){
  let el=document.getElementById('saveList');
  el.innerHTML=list.length===0?'<div class="empty">暂无存档</div>':'';
  list.forEach(item=>{
    let div=document.createElement('div');div.className='list-item';
    let t=new Date(item.createTime).toLocaleString();
    div.innerHTML=`<div class="item-info"><div class="title">${esc(item.displayName)}${item.hasPassword?'<span class="lock">🔒</span>':''}</div><div class="sub">ID:${item.id} · ${item.size}×${item.size} · ${item.players}人 · ${t}</div></div><button class="btn-restore" onclick="event.stopPropagation();restore(${item.id},${item.hasPassword})">恢复</button><button class="btn-del" onclick="event.stopPropagation();del(${item.id},${item.hasPassword})">删除</button>`;
    el.appendChild(div);
  });
}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}

}
function doJoin(rid,pwd){wsSend({type:"join",room:rid,joinPassword:pwd||''})}
function confirmPwd(){doJoin(pendingRid,document.getElementById('joinPwd').value);closeModal('pwdModal')}

function joinRandomRoom(){

function restore(id,hp){
  if(hp){pendSaveId=id;pendSaveAct='restore';document.getElementById('savePwdTitle').textContent='输入存档密码（恢复）';openModal('savePwdModal');document.getElementById('savePwdInput').value='';return}

}
function del(id,hp){
  if(hp){pendSaveId=id;pendSaveAct='delete';document.getElementById('savePwdTitle').textContent='输入存档密码（删除）';openModal('savePwdModal');document.getElementById('savePwdInput').value='';return}
  if(confirm('确定删除？'))doDel(id,'');
}
function doRestore(id,pwd){wsSend({type:"restoreSave",saveId:id,savePassword:pwd||''})}
function doDel(id,pwd){wsSend({type:"deleteSave",saveId:id,savePassword:pwd||''})}
function confirmSavePwd(){
  let p=document.getElementById('savePwdInput').value;

  else if(pendSaveAct==='delete')doDel(pendSaveId,p);

}
function confirmSave(){
  if(!inRoom){showMsg('仅在线模式可存档','error');closeModal('saveModal');return}

  let pwd=document.getElementById('savePwd').value;
  wsSend({type:"saveGame",remark:remark,savePassword:pwd});
  closeModal('saveModal');
}

function confirmReset(){
  if(gameMode==='local'){startLocalReset();return}
  let ns=parseInt(document.getElementById('resetSize').value)||size;
  let np=parseInt(document.getElementById('resetPlayers').value)||2;
  wsSend({type:"reset",size:ns,players:np});
  closeModal('resetModal');

function showMsg(t,c){

}

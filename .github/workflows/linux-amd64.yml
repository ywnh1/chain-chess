name: Linux x86_64 packages

# 为什么在 CI 出包而不在本地：
# 本机是 aarch64（termux proot），Tauri 的 Linux 后端要链 amd64 的
# webkit2gtk-4.1，而 libwebkit2gtk-4.1-dev 没有 Multi-Arch: same 标记，
# apt 装 amd64 版会挤掉本机的 arm64 版 —— 那正是出 arm64 包要用的东西。
# 所以 x86_64 的包扔到 GitHub 的 x86_64 runner 上出。
#
# 产物名与 Gitee Release 附件对应（amd64 是默认架构，不带后缀）：
#   chainchess-<ver>.deb
#   chainchess-<ver>.AppImage
# 跑完到 Actions 页面下 artifact，再传到 Gitee Release。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（tauri.conf.json 是唯一来源）
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('tauri/src-tauri/tauri.conf.json'))['version'])")
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file

      - name: 缓存 cargo 依赖源码
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'engine/Cargo.lock') }}

      - name: Tauri 构建 deb
        run: |
          cd tauri
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tauri build --bundles deb

      - name: 修正并打包
        run: |
          set -eu
          V='${{ steps.ver.outputs.version }}'
          RUST=tauri/src-tauri
          mkdir -p out

          is_gui() { strings -a "$1" 2>/dev/null | grep -qi webkit; }

          echo "--- target/release 顶层 ---"
          ls -1 "$RUST"/target/release | head -20
          echo "--- deps 里的 chain_chess* ---"
          ls -1 "$RUST"/target/release/deps 2>/dev/null | grep -i 'chain_chess' | head -20 || true
          echo "（以上为空说明 deps 下没有该产物，将使用顶层主程序）"

          # Tauri 在多个 bin 里挑主二进制时可能挑到 src/bin/ 下的 CLI 工具
          # （productName 是中文，匹配不上任何 bin），然后按 mainBinaryName
          # 改名，光看文件名看不出来。与本机 build.sh 同一处理：按 GUI 独有的
          # webkit 特征串确认，不靠文件名猜。
          #
          # 但**不能假设产物只在 deps/ 下**：这里曾经直接 ls deps/chain_chess-*
          # 并因找不到而整个构建失败（Tauri 实际报的路径是
          # target/release/chain-chess）。两个来源都试：
          #   1) Tauri 报告的顶层主程序 target/release/<mainBinaryName>
          #   2) older cargo 在 deps/ 下留的 chain_chess-<hash> 硬链接
          GUI=""
          for cand in "$RUST"/target/release/chain-chess \
                      $(ls -1t "$RUST"/target/release/deps/chain_chess-* 2>/dev/null | grep -v '\.d$' || true); do
            if [ -f "$cand" ] && is_gui "$cand"; then GUI="$cand"; break; fi
          done
          echo "GUI 产物: ${GUI:-（未找到）}"

          # 同一目录会累积历史 deb，只认当前版本
          SRC=$(ls -1t "$RUST"/target/release/bundle/deb/*_"$V"_*.deb | head -1)
          test -n "$SRC"

          TMP=$(mktemp -d)
          dpkg-deb -R "$SRC" "$TMP"
          # Tauri 拿中文 productName 当 Package 字段，dpkg 要求以字母数字开头
          sed -i 's/^Package: .*/Package: chain-chess/' "$TMP/DEBIAN/control"
          # deb 里打的不是 GUI 才替换；没有可用 GUI 产物时保留原样并说明
          if is_gui "$TMP/usr/bin/chain-chess"; then
            echo "deb 内已是 GUI 产物，无需替换"
          elif [ -n "$GUI" ]; then
            echo "deb 内是 CLI 产物，替换为: $GUI"
            cp "$GUI" "$TMP/usr/bin/chain-chess"
          else
            echo "❌ deb 内不是 GUI 产物，且找不到 GUI 二进制"
            exit 1
          fi
          dpkg-deb -b "$TMP" "out/chainchess-$V.deb" > /dev/null
          rm -rf "$TMP"

          # AppImage 从修好的 deb 组装：Tauri 自带的 appimage bundler 有同一个
          # 二进制问题，而且要联网拉 linuxdeploy
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPDIR=/tmp/AppDir
          rm -rf "$APPDIR"; mkdir -p "$APPDIR"
          dpkg-deb -x "out/chainchess-$V.deb" "$APPDIR"
          cp "$(ls -1 "$APPDIR"/usr/share/applications/*.desktop | head -1)" "$APPDIR/"
          cp "$(find "$APPDIR/usr/share/icons" -name '*.png' | sort -r | head -1)" "$APPDIR/"
          ln -sf usr/bin/chain-chess "$APPDIR/AppRun"

          # runner 的 umask 是 077：新建的目录/文件都是 0700/0600。
          # appimagetool 要求 AppDir 树对 others 可读可执行，否则
          # "mode 0700 ... Permission denied" 直接退出。
          # 只 chmod 顶层不够（解包出的子目录仍是 0700），要 -R 全树修；
          # 注意用 a+rX：目录加 x，文件只在已有 x 位时才加（AppRun 是符号链接）。
          chmod -R a+rX "$APPDIR"
          chmod a+rx "$APPDIR/AppRun"
          echo "--- AppDir 权限 ---"
          find "$APPDIR" -maxdepth 2 -printf '%M %p\n' | sort | head -12

          # --no-check-permissions 兜底：万一个别子项仍被判不合格，
          # 不让整次构建失败（权限已在上面统一修过）
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            /tmp/appimagetool --no-check-permissions "$APPDIR" "out/chainchess-$V.AppImage"

          echo "--- 产物 ---"
          ls -la out/
          echo "--- 架构自检 ---"
          dpkg-deb -f "out/chainchess-$V.deb" Package Version Architecture
          file "out/chainchess-$V.AppImage"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chainchess-linux-amd64-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 30

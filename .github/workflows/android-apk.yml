name: Android APK

# 为什么搬到 CI：本机是 aarch64 + termux proot，出 APK 要本机装完整
# Android SDK/NDK，还得绕开 aapt2 只有 x86_64 版本的问题（build.sh 里
# 那段 android.aapt2FromMavenOverride 就是为此）。GitHub 的 x86_64
# runner 预装了 SDK/NDK，aapt2 直接可用，省掉整套绕行逻辑。
#
# 产物名与 Gitee Release 附件对应：
#   chainchess-<ver>.apk
#
# 需要的 secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_KEYSTORE_BASE64   release.keystore 的 base64（单行）
#   ANDROID_KEYSTORE_PASSWORD keystore 密码
#   ANDROID_KEY_ALIAS         keystore 里的 key 别名
#
# 必须沿用同一个 keystore：签名变了，已安装的用户无法覆盖升级。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（tauri.conf.json 是唯一来源）
        id: ver
        run: |
          set -eu
          V=$(python3 -c "import json;print(json.load(open('tauri/src-tauri/tauri.conf.json'))['version'])")
          test -n "$V"
          # versionCode = major*1e6 + minor*1e3 + patch，与 build.sh 同一算法。
          # 去掉可能存在的 -beta 之类后缀。
          BASE=${V%%-*}
          MAJOR=${BASE%%.*}
          REST=${BASE#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          PATCH=${PATCH%%.*}
          VC=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version_base=$BASE" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "版本: $V（versionCode $VC）"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 cargo 依赖与 Android target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target/aarch64-linux-android
          key: ${{ runner.os }}-android-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-android-

      # 不用 android-actions/setup-android：它内部的 sdkmanager --licenses
      # 在 Node 24 下会退出码 1 整步失败。runner 镜像本来就带 SDK 与 NDK。
      - name: 检查预装的 Android SDK / NDK
        run: |
          set -eu
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"
          test -d "${ANDROID_HOME:-/nonexistent}" || { echo "缺少 ANDROID_HOME"; exit 1; }
          test -n "${ANDROID_NDK_LATEST_HOME:-}" && test -d "$ANDROID_NDK_LATEST_HOME" \
            || { echo "缺少 NDK"; exit 1; }
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      # 仓库里带了 Android 工程骨架，但 gradle.properties 是共享的：
      # 本机（aarch64）构建时 build.sh 会临时写入 aapt2 的原生覆盖路径，
      # 那是个本机绝对路径，CI 上必须清掉，否则 gradle 会去找不存在的文件。
      - name: 清掉本机专属的 gradle 配置
        run: |
          set -eu
          P=tauri/src-tauri/gen/android/gradle.properties
          if grep -q '^android\.aapt2FromMavenOverride=' "$P"; then
            sed -i '/^android\.aapt2FromMavenOverride=/d' "$P"
            echo "已删除 aapt2FromMavenOverride"
          else
            echo "无本机 aapt2 覆盖，跳过"
          fi

      - name: 写入 Android 版本号
        run: |
          set -eu
          P=tauri/src-tauri/gen/android/app/tauri.properties
          {
            echo "// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
            echo "tauri.android.versionName=${{ steps.ver.outputs.version_base }}"
            echo "tauri.android.versionCode=${{ steps.ver.outputs.version_code }}"
          } > "$P"
          cat "$P"

      # Tauri 不会把 icons/android 自动塞进 Android 工程。
      # 仓库里的 gen/android 已带新图标，这一步是幂等保险：
      # 将来若重新 init 过工程，图标会被模板默认图覆盖，这里补回来。
      #
      # 只覆盖 mipmap-* 的位图，不引入 mipmap-anydpi-v26：
      # tauri icon 生成的 ic_launcher_foreground 四角是透明的，
      # 配上它定义的白色背景，Android 8+ 会在图标外圈露出白边。
      - name: 注入应用图标
        run: |
          set -eu
          test -d tauri/src-tauri/icons/android/mipmap-xxxhdpi \
            || { echo "缺少 tauri/src-tauri/icons/android，先跑 npx tauri icon"; exit 1; }
          for d in tauri/src-tauri/icons/android/mipmap-*; do
            test -d "$d" || continue
            cp -v "$d"/*.png tauri/src-tauri/gen/android/app/src/main/res/"$(basename "$d")"/
          done
          echo "--- 覆盖后的图标 ---"
          ls -la tauri/src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/

      - name: 还原签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KEYSTORE_B64" || { echo "缺少 secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore || { echo "keystore 解码为空"; exit 1; }
          echo "keystore 已就绪（$(stat -c %s /tmp/release.keystore) 字节）"

      - name: 安装前端依赖
        run: |
          cd tauri
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 构建 APK
        # 只打 arm64：覆盖绝大多数真机。四个 ABI 全打会让时长翻数倍。
        run: |
          cd tauri
          npx tauri android build --apk --target aarch64

      - name: 签名并整理产物
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          V='${{ steps.ver.outputs.version }}'
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "缺少 secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }

          # tauri android build 产出的名字随 Tauri 版本变过（universal / 按 ABI），
          # 不写死路径，直接找。
          UNSIGNED=$(find tauri/src-tauri/gen/android/app/build/outputs/apk \
            -name '*.apk' -print | head -1)
          test -n "$UNSIGNED" || { echo "没找到 APK 产物"; exit 1; }
          echo "未签名产物: $UNSIGNED"

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -r | head -1)
          test -n "$APKSIGNER" || { echo "找不到 apksigner"; exit 1; }

          mkdir -p out
          OUT="out/chainchess-${V}.apk"
          cp "$UNSIGNED" "$OUT"

          # 与 build.sh 一致：apksigner 手工签，不改 gradle 的 signingConfig，
          # 这样 CI 产物与本机构建的签名流程完全相同。
          if [ -n "${KEY_ALIAS:-}" ]; then
            "$APKSIGNER" sign --ks /tmp/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --out "$OUT" "$OUT"
          else
            "$APKSIGNER" sign --ks /tmp/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --out "$OUT" "$OUT"
          fi

          echo "--- 验证签名 ---"
          "$APKSIGNER" verify --verbose "$OUT"

          rm -f /tmp/release.keystore
          echo "--- 产物 ---"
          ls -la out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chainchess-android-${{ steps.ver.outputs.version }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

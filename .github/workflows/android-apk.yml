name: Android APK

# 为什么搬到这里：本机（termux proot aarch64）跑一次 APK 要十几分钟，
# 且要本地装好 SDK/NDK。GitHub 的 ubuntu runner 自带 Android SDK，
# 把它放这儿出包，本地只留 deb/AppImage 那套。
#
# 产物名与 Gitee Release 附件对应：
#   chainchess-<ver>.apk
#
# 签名需要两个 repository secret（没有就出未签名包，同样能装，只是不能
# 覆盖安装正式版、也不能上架）：
#   ANDROID_KEYSTORE_BASE64     release.keystore 的 base64
#   ANDROID_KEYSTORE_PASSWORD   它的密码
# 生成：base64 -w0 release.keystore

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（tauri.conf.json 是唯一来源）
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('tauri/src-tauri/tauri.conf.json'))['version'])")
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 会把 ANDROID_HOME / ANDROID_SDK_ROOT 设好。
      # 不能留默认的 packages（默认含 tools，而新版 SDK 已经没这个包，
      # sdkmanager 会以退出码 1 挂掉），显式列出真正需要的。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: 准备 NDK
        run: |
          # Tauri Android 需要 NDK；runner 镜像里通常已经装了一个，
          # 没有就现装一个并指给 cargo
          NDK_DIR=$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | head -1 || true)
          if [ -z "$NDK_DIR" ]; then
            yes | sdkmanager --install "ndk;26.1.10909125" > /dev/null
            NDK_DIR="${ANDROID_HOME}/ndk/26.1.10909125"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "用的是 NDK: $NDK_DIR"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 cargo 依赖源码
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'engine/Cargo.lock') }}

      - name: 准备签名密钥
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > release.keystore
            echo "SIGN=1" >> "$GITHUB_ENV"
            echo "已恢复 keystore，将产出签名包"
          else
            echo "SIGN=0" >> "$GITHUB_ENV"
            echo "没有 keystore secret，产出未签名包"
          fi

      - name: 构建 APK
        run: |
          cd tauri
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tauri android build --target aarch64 --apk

      - name: 签名并整理产物
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          V='${{ steps.ver.outputs.version }}'
          UNSIGNED=tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          test -f "$UNSIGNED" || { echo "没找到未签名 APK: $UNSIGNED"; find tauri/src-tauri/gen/android -name '*.apk' | head; exit 1; }

          mkdir -p out
          if [ "$SIGN" = "1" ]; then
            apksigner sign --ks release.keystore --ks-pass "pass:${KS_PASS}" \
              --out "out/chainchess-$V.apk" "$UNSIGNED"
            apksigner verify --verbose "out/chainchess-$V.apk" | sed 's/^/  /'
          else
            cp "$UNSIGNED" "out/chainchess-$V-unsigned.apk"
          fi
          rm -f release.keystore

          echo "--- 产物 ---"
          ls -la out/
          file out/*.apk || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chainchess-android-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 30

name: Windows exe

# 为什么搬到这里：本机是 aarch64 + termux proot，出 Windows exe 要靠
# cargo-xwin 交叉编译，慢且依赖 xwin 缓存。Windows runner 上原生编最简单。
#
# 产物名与 Gitee Release 附件对应：
#   chainchess-<ver>.exe
# 项目发的是裸 exe（不带 NSIS 安装包），这里保持一致。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号（tauri.conf.json 是唯一来源）
        id: ver
        run: |
          # Windows 上 python 默认用 cp1252 读文件，而 tauri.conf.json 里有中文
          # （productName 是「连锁棋」），不显式指定编码会 UnicodeDecodeError
          V=$(python -c "import json,io;print(json.load(io.open('tauri/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 cargo 依赖源码
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-exe-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock', 'engine/Cargo.lock') }}

      - name: 构建 exe
        run: |
          # 不走 tauri CLI：这是多 bin 项目（src/bin/ 下有 AI 对局等 CLI 工具），
          # 而 productName 是中文「连锁棋」，匹配不上任何 bin，Tauri 就退而取其
          # 一个 —— 实测挑到的是 battle。它的产物是 console 程序，不是 GUI。
          # 直接指定 bin，与本地 build.sh 的 cargo-xwin 产物一致。
          cd tauri/src-tauri
          cargo build --release --bin chain-chess

      - name: 整理产物并自检
        run: |
          set -eu
          V='${{ steps.ver.outputs.version }}'
          SRC=tauri/src-tauri/target/release/chain-chess.exe
          test -f "$SRC" || { echo "missing: $SRC"; ls -la tauri/src-tauri/target/release/ | head -20; exit 1; }

          # 判据是 PE 头的 Subsystem 字段：2 = GUI，3 = 控制台。
          # 看体积或找 WebView2 字符串都不靠谱（本项目的 WebView2 是动态加载的，
          # 字符串不一定在，而 strip 过的 GUI 也可能只有几 MB）。
          python - "$SRC" <<'PY'
          import struct, sys
          # Windows 控制台默认 cp1252，print 中文会 UnicodeEncodeError
          try:
              sys.stdout.reconfigure(encoding='utf-8')
          except Exception:
              pass
          data = open(sys.argv[1], 'rb').read()
          pe = struct.unpack_from('<I', data, 0x3C)[0]
          assert data[pe:pe+4] == b'PE\x00\x00', 'not a PE file'
          subsystem = struct.unpack_from('<H', data, pe + 0x5C)[0]
          kind = {2: 'GUI', 3: 'console'}.get(subsystem, f'other({subsystem})')
          print(f"size: {len(data)/1024/1024:.1f} MB")
          print(f"PE subsystem: {subsystem} ({kind})")
          if subsystem != 2:
              print("expected a GUI subsystem (2) - wrong binary got built")
              sys.exit(1)
          PY

          mkdir -p out
          cp "$SRC" "out/chainchess-$V.exe"
          echo "--- artifact ---"
          ls -la out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chainchess-windows-${{ steps.ver.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 30

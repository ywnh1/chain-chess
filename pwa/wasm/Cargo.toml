[package]
name = "chain_chess_engine"
version = "3.2.2"
edition = "2021"
description = "连锁棋 PWA 游戏引擎（WASM）— 由 tauri 核心逻辑提取"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
alpha_beta_pruning = { path = "vendor/alpha_beta_pruning", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
